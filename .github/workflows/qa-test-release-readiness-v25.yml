name: QA Bible Unfolded TEST full pre-release regression v32 (eleven groups)
on:
  push:
    paths:
      - '.github/workflows/qa-test-release-readiness-v25.yml'
      - '.github/workflows/qa-word-trails-full-backup-transaction-v7.yml'
      - '.github/workflows/qa-native-backup-live-key-isolation-v26.yml'
      - '.github/workflows/qa-native-test-backup-restore-preview-v27.yml'
      - '.github/workflows/qa-test-native-journal-crash-safety-v30.yml'
      - '.github/workflows/qa-native-recovery-review-panel-v31.yml'
      - '.github/workflows/qa-native-external-page-guard-v32.yml'
      - 'scripts/qa_native_external_page_storage_guard_v32.cjs'
      - 'scripts/qa_native_external_page_storage_guard_v32_real_browser.cjs'
      - 'scripts/qa_native_recovery_review_panel_v31.cjs'
      - 'scripts/qa_native_v2_previous_only_journal_fail_closed_v30.cjs'
      - '.github/workflows/qa-test-trivia-family-visuals-v29.yml'
      - '.github/workflows/qa-trivia-scholar-v1.yml'
      - '.github/workflows/qa-trivia-wrong-tone-v1.yml'
      - '.github/workflows/qa-trivia-answer-scroll-v1.yml'
      - '.github/workflows/qa-family-worship-picker-gallery-v3.yml'
      - 'journey-progress-caption.js'
      - 'scripts/qa_native_test_backup_readonly_plan_v27.cjs'
      - 'scripts/qa_native_test_backup_live_word_trails_key_isolation_v26.cjs'
      - 'experiments/word-trails-native-full-backup-transaction-v7.js'
      - 'scripts/qa_word_trails_native_full_backup_transaction_v7.cjs'
      - 'scripts/qa_word_trails_native_full_backup_transaction_v7_real_browser.cjs'
      - 'scripts/visual_lab_all_mode_smoke_test.cjs'
      - 'scripts/word_trails_native_shell_integration_test.cjs'
      - 'scripts/qa_word_trails_native_audio_wheel_owner_v23.cjs'
      - 'scripts/qa_word_trails_native_settings_checkpoint_entry_v24.cjs'
      - 'scripts/word_trails_save_v2_browser_test.cjs'
      - 'scripts/qa_word_trails_full_backup_journal_guard_v6.cjs'
      - 'bu-platform-saves-v2.js'
      - 'bu-platform-rewards-v1.js'
      - 'visual-lab-test-banner.js'
      - 'word-trails-native-shell-v1.js'
      - 'word-trails-next-launcher.js'
      - 'word-trails-checkpoint-native-settings-practice-v1.js'
      - 'experiments/word-trails-next-v1.js'
      - 'experiments/word-trails-feel-v2.js'
      - 'experiments/word-trails-full-backup-journal-guard-v6.js'
      - 'experiments/word-trails-levels-12-30-v1.js'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-external-page-guard:
    name: Detect cross-document LIVE migration/shared native progress writes and block unsafe imports
    uses: ./.github/workflows/qa-native-external-page-guard-v32.yml
  native-player-recovery-review:
    name: Native TEST Settings must show recovery review, preserve journal, download and block v1/v2 imports
    uses: ./.github/workflows/qa-native-recovery-review-panel-v31.yml
  native-v2-stale-journal-never-rewinds:
    name: TEST native crash journals must not silently roll back newer wallet or game progress
    uses: ./.github/workflows/qa-test-native-journal-crash-safety-v30.yml
  approved-trivia-and-family-visuals:
    name: Trivia sounds/scroll/stone art and Family Worship mobile interaction
    uses: ./.github/workflows/qa-test-trivia-family-visuals-v29.yml
  native-readonly-restore-parity:
    name: Read-only native restore preview must match v2 and safe v7 candidate
    uses: ./.github/workflows/qa-native-test-backup-restore-preview-v27.yml
  native-test-vs-live-backup-isolation:
    name: TEST backup exports and restores cannot overwrite LIVE Word Trails
    uses: ./.github/workflows/qa-native-backup-live-key-isolation-v26.yml
  full-backup-v7-two-tab-guard:
    name: TEST-only v7 synthetic transaction and two-tab conflict proof
    uses: ./.github/workflows/qa-word-trails-full-backup-transaction-v7.yml
  all-30-crossword-levels-and-original-voices:
    name: Solve all 30 Word Trails levels + 20 native voice assets
    uses: ./.github/workflows/qa-word-trails-30-voice.yml
  original-modes-and-word-trails-navigation:
    name: Original modes + Word Trails portrait/landscape
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Chrome driver
        run: npm install --prefix /tmp/bu-release-modes puppeteer-core@24 --silent --no-audit --no-fund
      - name: Browser navigation, gameplay shells, rewards and no JS errors
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8895 --bind 127.0.0.1 >/tmp/bu-release-allmodes-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-release-modes/node_modules node scripts/visual_lab_all_mode_smoke_test.cjs
  native-menu-audio-and-wheel:
    name: Native Settings, menu, voice, SFX, Ocean Glow and back/refresh
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Chrome driver
        run: npm install --prefix /tmp/bu-release-audio puppeteer-core@24 --silent --no-audit --no-fund
      - name: Native menu, original Settings, audio ownership, announcer and navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8891 --bind 127.0.0.1 >/tmp/bu-release-menu-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-release-audio/node_modules node scripts/word_trails_native_shell_integration_test.cjs
      - name: Native audio owner, voice delegate, wheel effects and touch sizing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/bu-release-wheel-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-release-audio/node_modules node scripts/qa_word_trails_native_audio_wheel_owner_v23.cjs
  native-backup-practice-and-crossword-safe-progress:
    name: Native practice entry, export/import and guarded save regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, content quality and synthetic full-backup race
        shell: bash
        run: |
          set -euo pipefail
          node --check bu-platform-saves-v2.js
          node --check experiments/word-trails-full-backup-journal-guard-v6.js
          node --check scripts/word_trails_save_v2_browser_test.cjs
          node --check scripts/qa_word_trails_full_backup_journal_guard_v6.cjs
          node scripts/word_trails_quality_gate.mjs
          node scripts/word_trails_shared_rewards_integration_test.mjs
          node scripts/qa_word_trails_full_backup_journal_guard_v6.cjs
      - name: Install isolated Chrome driver
        run: npm install --prefix /tmp/bu-release-saves puppeteer-core@24 --silent --no-audit --no-fund
      - name: Real TEST save/export/restore in synthetic browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8894 --bind 127.0.0.1 >/tmp/bu-release-saves-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-release-saves/node_modules node scripts/word_trails_save_v2_browser_test.cjs
      - name: Original Settings safe recovery rehearsal (fake data only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8892 --bind 127.0.0.1 >/tmp/bu-release-rehearsal-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-release-saves/node_modules node scripts/qa_word_trails_native_settings_checkpoint_entry_v24.cjs
