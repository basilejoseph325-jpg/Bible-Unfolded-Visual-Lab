name: Publish verified gold button mask fix (one-time)
on:
  push:
    paths:
      - .github/workflows/publish-pt-mask-fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update cache versions and remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html')
          css=Path('trivia-together-premium.css')
          card=Path('play-together-cinematic.css')
          page=html.read_text(encoding='utf-8')
          styles=css.read_text(encoding='utf-8')
          card_css=card.read_text(encoding='utf-8')
          old='<link rel="stylesheet" href="trivia-together-premium.css?v=play-together-clean-icons-v8">'
          new='<link rel="stylesheet" href="trivia-together-premium.css?v=play-together-mask-fixed-v9">'
          old_import='@import url("./play-together-cinematic.css?v=play-together-clean-icons-v8");'
          new_import='@import url("./play-together-cinematic.css?v=play-together-mask-fixed-v9");'
          if page.count(old)!=1:raise SystemExit('Unexpected HTML stylesheet reference')
          if styles.count(old_import)!=1:raise SystemExit('Unexpected stylesheet import')
          intended_selectors=[
            '#bu35-family #bu35-body:has(> .bu35-hero #bu35-new)>.bu35-hero #bu35-new::before,',
            '#bu35-family #bu35-body:has(> .bu35-hero #bu35-new)>.bu35-card #wb36-family-open::before,',
            '#bu35-family #bu35-body:has(> .bu35-hero #bu35-new)>.bu35-card #bu3834-family-entry::before,'
          ]
          if not all(s in card_css for s in intended_selectors):
              raise SystemExit('Source mask selector fix missing')
          if 'Play Together gold primary action polish v6' not in card_css:
              raise SystemExit('Gold primary action style missing')
          if 'play-together-clean-icons-v8' not in page:raise SystemExit('JS cache version missing')
          html.write_text(page.replace(old,new),encoding='utf-8')
          css.write_text(styles.replace(old_import,new_import),encoding='utf-8')
          print('Confirmed corrected icons and upgraded both CSS URLs to v9; JS unchanged.')
          PY
          git rm -- .github/workflows/diagnose-pt-buttons.yml
          git rm -- .github/workflows/publish-pt-mask-fix.yml
          git add -- index.html trivia-together-premium.css
          python3 - <<'PY'
          import subprocess
          modified=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            'index.html','trivia-together-premium.css',
            '.github/workflows/diagnose-pt-buttons.yml',
            '.github/workflows/publish-pt-mask-fix.yml'
          }
          if modified!=expected:raise SystemExit('Unexpected modified files: '+repr(modified))
          print('No game logic, progress data, or other assets altered.')
          PY
      - name: Publish clean verified version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Visual Lab: deploy verified icon-only mask fix with fresh CSS URL"
          git push origin HEAD:main
