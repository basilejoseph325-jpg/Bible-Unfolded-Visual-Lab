name: Audit Family Worship every phase and result (read-only)
on:
  push:
    paths: ['.github/workflows/audit-family-worship-phase-lifecycle.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate Family Worship question and round-completion renderer branches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=''.join(p.read_text(errors='replace') for p in sorted(Path('.').glob('bible_unfolded_core_part*.js')))
          names=['bu35Begin','bu35Phase','bu35NextPhase','bu35AfterTurn','bu35RenderGame','bu35Trivia','bu35BindTrivia','bu35Words','bu35BindWords','bu35Wheel','bu35BindWheel','bu35Think','bu35Finish','bu35BindFinish','bu35Handoff','bu35Reading']
          for n in names:
            start=s.find('function '+n+'(')
            print('=== FUNCTION',n,'START',start,'===')
            if start<0:continue
            next_func=re.search(r'\nfunction\s+[A-Za-z_]\w*\s*\(',s[start+1:])
            end=min(start+1+next_func.start(),start+13000) if next_func else start+13000
            sample=s[start:end]
            print('FUNCTION_BODY',n,'LEN',len(sample),sample.replace(chr(10),'\\n')[:11000])
          start=s.find('function bu35BuildPhases(')
          print('=== FUNCTION bu35BuildPhases ===',s[start:start+4400].replace(chr(10),'\\n'))
          PY
