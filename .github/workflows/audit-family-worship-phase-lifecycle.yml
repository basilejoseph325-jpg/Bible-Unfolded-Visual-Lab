name: Audit Family Worship every phase and result (read-only)
on:
  push:
    paths: ['.github/workflows/audit-family-worship-phase-lifecycle.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate Family Worship question and round-completion renderer branches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='replace')
          names=['bu35Phase','bu35Render','bu35Game','bu35Answer','bu35Start','bu35Next','bu35Evaluate','bu35Complete','bu35Select','bu35Choose','bu35Advance','bu35Finish','bu35View']
          for name in names:
              hits=list(re.finditer(r'\b'+name+r'\b',s))
              print('SYMBOL',name,'COUNT',len(hits))
              for m in hits[:19]:
                  i=m.start()
                  print('SYMHIT',name,i,s[max(0,i-350):i+620].replace(chr(10),'\\n')[:1000])
          for pat in [r'function\s+bu35\w*\s*\(',r'(?:const|let|var)\s+bu35\w*\s*=']:
              hits=list(re.finditer(pat,s))
              print('DEFINITIONS',pat,len(hits))
              for m in hits[:110]:
                  print('DEFINITION',m.group(0),'OFFSET',m.start(),s[m.start():m.start()+350].replace(chr(10),'\\n'))
          for lit in ['Read answer explanation','Read the hint','View full session summary','trivia','lightning','think','story','words','wheel','finish','bu35-feedback','bu3829-tip','bu35-result']:
              matches=list(re.finditer(re.escape(lit),s,re.I))
              eligible=[m for m in matches if m.start()>400000]
              print('CODE_LIT',lit,'COUNT',len(eligible),'FIRST',[(m.start(),s[max(0,m.start()-85):m.start()+140].replace(chr(10),' ')) for m in eligible[:12]])
          PY
