name: Inspect Story Adventure actual star effect (read only)
on:
  push:
    paths:
      - '.github/workflows/inspect-word-trails-ui-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify actual moving Story Adventure sparkles, stars and their CSS/JS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          sources=[Path('index.html'),*sorted(Path('.').glob('bible_unfolded_core_part*.js'))]
          pats=['reveal-spark','story-spark','sparkle','starburst','star-field','stardust','starfield','twinkle','orbit','swirl','spiral','motes','glimmer','magic-dust','star-particle','particle-star','star-layer','star-shower','reveal-star']
          for src in sources:
            s=src.read_text(encoding='utf8')
            print('\nSOURCE',src,'BYTES',len(s))
            for p in pats:
              hits=[m.start() for m in re.finditer(re.escape(p),s,re.I)]
              if hits:
                print('MATCH',p,'COUNT',len(hits))
                for off in hits[:8]:print('CTX',off,repr(s[max(0,off-290):off+480]))
            # Named keyframes containing story star, spark, pulse, swirl, orbit, shimmer, twinkle
            for m in re.finditer(r'@keyframes\s+([\w-]+)',s):
              name=m.group(1)
              if re.search(r'star|spark|orbit|swirl|twinkl|glow|shine|spiral|magic|mote',name,re.I):
                print('ANIMATION',name,'AT',m.start(),'CSS',repr(s[m.start():m.start()+700]))
          print('END')
          PY
