name: Inspect Trivia question and score DOM (read only, bounded)
on:
  push:
    paths:
      - '.github/workflows/inspect-word-trails-ui-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect bounded actual Trivia markup and styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets=['Keep exploring!','Score 60%','First try +20','New answer Points','Beginner challenge','bu34-trivia','bu34-body','triviaLab','Trivia complete','First-completion','Play Again','Which statement about God appears']
          paths=[Path('index.html'),Path('bible_unfolded_core_part5.js')]
          for f in paths:
            s=f.read_text(encoding='utf8')
            print('FILE',f,'LEN',len(s),flush=True)
            for key in targets:
              pos=0;indices=[]
              while True:
                i=s.lower().find(key.lower(),pos)
                if i<0:break
                indices.append(i);pos=i+len(key)
                if len(indices)>=12:break
              if not indices:continue
              print('TERM',repr(key),'N',len(indices),flush=True)
              for idx in indices[-3:]:
                chunk=s[max(0,idx-950):min(len(s),idx+2350)]
                chunk=re.sub(r'base64,[A-Za-z0-9+/=]{100,}','base64,[IMAGE]',chunk)
                print('CTX',repr(key),'AT',idx,repr(chunk)[:3300],flush=True)
          print('END',flush=True)
          PY
