name: Inspect Mixed Trivia landing markup and foliage (read only)
on:
  push:
    paths:
      - '.github/workflows/inspect-word-trails-ui-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Mixed Trivia real markup and image treatments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('index.html'),Path('trivia-landing-test.html'),Path('trivia-landing-test-v2.html'),Path('bible_unfolded_core_part5.js'),Path('word-builder-flat-hero-v2.css')]
          keys=['FULL-BIBLE CHALLENGE','Full-Bible Challenge','Mixed Trivia','Your Challenge','A different journey','spanning people','Prophecy','labHero','labCard','triviaLab','word-builder-olive-overlay.png','wb-hero-olive-corners.svg','trivia-native-v2.css','trivia-landing-test']
          for fn in files:
            if not fn.exists():continue
            s=fn.read_text(encoding='utf8')
            print('FILE',fn,'CHARS',len(s))
            for key in keys:
              hits=list(re.finditer(re.escape(key),s,re.I))
              print('KEY',repr(key),'HITS',len(hits))
              for m in hits[:3]:
                b=max(0,m.start()-850);e=min(len(s),m.end()+1250)
                print('CTX',repr(key),'POS',m.start(),repr(s[b:e][:2600]))
            if fn.name=='index.html':
              ids=['triviaLab','labHero','labCard','labPills','labTags','labContent','bu386-page']
              for name in ids:
                for m in list(re.finditer(r'#[a-zA-Z0-9_:., >+\-]*(?:'+re.escape(name)+r')[a-zA-Z0-9_:., >+\-]*\s*\{[^{}]{0,900}\}',s))[:9]:
                  print('RULE',name,repr(m.group(0)[:1200]))
          PY
