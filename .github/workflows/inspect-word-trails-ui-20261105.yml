name: Inspect Word Trails actual DOM CSS and completion hooks (read only)
on:
  push:
    paths:
      - '.github/workflows/inspect-word-trails-ui-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact matching CSS selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf8')
          keys=['#crossword-screen','#xword-content','.trail-board','.trail-square','.trail-finish','.trail-victory-grid','.trail-victory-star','.trail-wheel','.trail-wheel-row','.xword-letter','.trail-topline','.trail-word-preview','.trail-toolbar','.bu3918-trail','.trail-quick','.trail-actions']
          for key in keys:
            positions=[m.start() for m in re.finditer(re.escape(key),s,re.I)]
            print('KEY',repr(key),'COUNT',len(positions))
            for off in positions[:2]+positions[-3:]:
              print('HIT',off,repr(s[max(0,off-180):off+650]))
          print('RULES')
          rules=[]
          for m in re.finditer(r'([^{}]{0,250})\{([^{}]{0,2400})\}',s):
            selector=m.group(1).strip()
            if len(selector)>200 or '<' in selector or '=>' in selector:continue
            if re.search(r'(trail-|xword-|crossword-screen|cross-continue|cross-repeat)',selector,re.I):
              rules.append((m.start(),selector,m.group(2).strip()))
          print('RULE COUNT',len(rules))
          for off,sel,body in rules[-130:]:
            print('RULE',off,repr(sel),repr(body[:800]))
          PY
