name: Inspect Trivia native question and round-ending renderer (read only)
on:
  push:
    paths:
      - '.github/workflows/inspect-word-trails-ui-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual Trivia selectors, answer states and result controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=[Path('index.html'),*sorted(Path('.').glob('bible_unfolded_core_part*.js')),Path('trivia-native-v2.css')]
          needles=['Which statement about God appears','Keep exploring!','Score 60%','First try +20','New answer Points','Beginner challenge','Play Again','First-completion reward','bu-native-trivia','triviaLab','bu34-trivia','bu34-body','trivia finish','trivia-results','bu386-page']
          def clean(s):
            s=re.sub(r'data:image/[^;]*;base64,[A-Za-z0-9+/=]{140,}', '[EMBEDDED_IMAGE]', s)
            return s.replace('\n',' ')[:2800]
          for f in paths:
            if not f.exists():continue
            s=f.read_text(encoding='utf8')
            print('FILE',f,'LEN',len(s))
            for needle in needles:
              hits=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              if not hits:continue
              print('MATCH',repr(needle),'COUNT',len(hits))
              for idx in hits[:2]+hits[-1:]:
                print('CTX',repr(needle),idx,repr(clean(s[max(0,idx-1050):idx+1650])))
            if f.name=='index.html':
              for name in ['bu-native-trivia','bu34-body','bu34-trivia','triviaLab','bu38','bu39']:
                pats=[m for m in re.finditer(r'[^{}<>]{0,210}\{[^{}]{0,1900}\}',s) if name in m.group(0)[:210]]
                print('CSS_RULE_COUNT',name,len(pats))
                for m in pats[-24:]:
                  print('RULE',name,repr(clean(m.group(0)[:1600])))
            if f.name=='trivia-native-v2.css':
              rules=[m.group(0) for m in re.finditer(r'[^{}]{0,280}\{[^{}]{0,2300}\}',s) if 'base64' not in m.group(0)]
              print('TRIVIA_CSS_RULES',len(rules))
              for rule in rules[-135:]:
                print('RULE',repr(clean(rule[:1100])))
            print('END FILE')
          PY
