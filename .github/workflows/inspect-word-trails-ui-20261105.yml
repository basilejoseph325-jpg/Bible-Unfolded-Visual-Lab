name: Inspect Story Adventure exact reward-star animation (read only)
on:
  push:
    paths:
      - '.github/workflows/inspect-word-trails-ui-20261105.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact Story Adventure discovery effect sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for fn in ['index.html','bible_unfolded_core_part5.js']:
            s=Path(fn).read_text(encoding='utf8')
            print('\nSOURCE',fn)
            for needle in ['.bu3814-particle-field','.bu3814-main-star','.bu3814-celebration','.buhq-glitter','.buhq-spark','.reveal-pulse','.reveal-spark','bu3814-particle-field','bu3814-main-star','buhq-glitter']:
              idxs=[m.start() for m in re.finditer(re.escape(needle),s)]
              print('NEEDLE',needle,'COUNT',len(idxs))
              for i in idxs[:4]:
                chunk=s[max(0,i-600):i+1600]
                if len(chunk)>2300:chunk=chunk[:2300]
                print('CONTEXT',i,repr(chunk))
            for m in re.finditer(r'@keyframes\s+([\w-]+)',s):
              name=m.group(1)
              if any(x in name for x in ['bu3814','buhq','revealTwinkle']):
                print('KEYFRAMES',name,repr(s[m.start():m.start()+1350]))
          PY
