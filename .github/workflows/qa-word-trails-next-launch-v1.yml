name: QA Word Trails NEXT launcher Visual Lab
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-next-launch-v1.yml'
      - 'word-trails-next-launcher.js'
      - 'visual-lab-test-banner.js'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate route isolation and JavaScript syntax
        run: |
          node --check word-trails-next-launcher.js
          node --check visual-lab-test-banner.js
          python3 - <<'PY'
          from pathlib import Path
          banner=Path('visual-lab-test-banner.js').read_text()
          launcher=Path('word-trails-next-launcher.js').read_text()
          assert 'word-trails-next-launcher.js' in banner
          assert "document.getElementById('cross-pick')" in launcher
          assert 'word-trails-next-v1.html' in launcher
          assert 'Show previous Word Trails for comparison' in launcher
          assert 'wt-next-compare' in launcher
          assert 'Visual Lab only' in launcher
          print('PASS launcher does not alter live or main game logic')
          PY
      - name: Test Word Trails selector replacement card and old-version toggle
        run: |
          npm install --prefix /tmp/bu-next-launch puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/bu-next-visual-root.log 2>&1 &
          node <<'JS'
          const puppeteer=require('/tmp/bu-next-launch/node_modules/puppeteer-core');
          const assert=require('node:assert/strict'),{execSync}=require('node:child_process');
          (async()=>{
            let browser;
            try{
              browser=await puppeteer.launch({headless:true,
                executablePath:execSync('command -v google-chrome || command -v chromium',{encoding:'utf8'}).trim(),
                args:['--no-sandbox','--disable-setuid-sandbox']});
              const page=await browser.newPage();
              page.on('pageerror',e=>{console.error('PAGE_ERROR',e.message);process.exitCode=1});
              await page.setViewport({width:390,height:705,isMobile:true,hasTouch:true});
              await page.setContent('<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="cross-pick"><div class="mode-scroll"><div id="cross-pack-list" class="cross-pack-list" style="display:flex"><button>Old game</button></div></div></div></body></html>');
              await page.addScriptTag({path:'word-trails-next-launcher.js'});
              const first=await page.evaluate(()=>({
                link:document.querySelector('#wt-next-entry>a')?.getAttribute('href'),
                title:document.querySelector('.wt-next-title')?.textContent,
                oldDisplay:getComputedStyle(document.querySelector('.cross-pack-list')).display,
                cardHeight:document.querySelector('#wt-next-entry>a')?.getBoundingClientRect().height
              }));
              console.log('LAUNCHER',JSON.stringify(first));
              assert.equal(first.link,'experiments/word-trails-next-v1.html');
              assert.equal(first.oldDisplay,'none');
              assert(first.cardHeight>=180);
              await page.click('#wt-next-compare');
              const second=await page.evaluate(()=>({
                oldDisplay:getComputedStyle(document.querySelector('.cross-pack-list')).display,
                button:document.querySelector('#wt-next-compare').textContent
              }));
              assert.equal(second.oldDisplay,'flex');
              assert(second.button.includes('Hide previous'));
              console.log('PASS Word Trails NEXT default card, safe old-version comparison toggle');
              await page.goto('http://127.0.0.1:8766/index.html',{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForSelector('#wt-next-entry',{timeout:60000});
              const real=await page.evaluate(()=>({
                banner:!!document.querySelector('#home #bu-visual-lab-test-banner'),
                entry:!!document.querySelector('#cross-pick #wt-next-entry'),
                link:document.querySelector('#wt-next-entry>a')?.getAttribute('href'),
                legacyDefaultHidden:!document.querySelector('#cross-pick').classList.contains('wt-next-compare')
              }));
              console.log('REAL_VISUAL_LAB',JSON.stringify(real));
              assert(real.banner&&real.entry&&real.legacyDefaultHidden);
              assert.equal(real.link,'experiments/word-trails-next-v1.html');
              console.log('PASS actual Visual Lab root includes Word Trails NEXT entry and preserved TEST banner');

              const homeCandidates=await page.evaluate(()=>
                [...document.querySelectorAll('#home button,#home a,#home [role="button"],#home [onclick]')]
                 .filter(el=>/trail|word/i.test((el.innerText||el.textContent||'').slice(0,110)))
                 .slice(0,16).map(el=>({
                   tag:el.tagName,id:el.id,cls:String(el.className).slice(0,110),
                   text:(el.innerText||el.textContent||'').trim().slice(0,110),
                   attrs:[...el.attributes].map(x=>x.name+'='+x.value.slice(0,100)).slice(0,9)
                 }))
              );
              console.log('TRAIL_HOME_CANDIDATES',JSON.stringify(homeCandidates));
              const visible=await page.evaluate(()=>
                [...document.querySelectorAll('#home button,#home a,#home [role="button"]')]
                 .filter(el=>/word trails/i.test((el.innerText||el.textContent||'').slice(0,110)))
                 .filter(el=>{const b=el.getBoundingClientRect();const s=getComputedStyle(el);return b.width>0&&b.height>0&&s.visibility!=='hidden'})
                 .map(el=>({tag:el.tagName,id:el.id,html:el.outerHTML.slice(0,580)}))
              );
              console.log('TRAIL_HOME_VISIBLE',JSON.stringify(visible));

              assert(visible.some(x=>x.id==='home-cross'),'Homepage must expose its normal Bible Word Trails card');
              await page.evaluate(()=>{
                window.__wtHomeProbe=[];
                const data=(scope,e)=>window.__wtHomeProbe.push({scope,target:e.target?.id,phase:e.eventPhase,
                  path:e.composedPath().slice(0,4).map(x=>x?.id||x?.nodeName)});
                window.addEventListener('click',e=>data('window',e),true);
                document.addEventListener('click',e=>data('document',e),true);
                document.querySelector('#home-cross').addEventListener('click',e=>data('button',e),true);
              });
              await page.click('#home-cross');
              await new Promise(r=>setTimeout(r,550));
              const homeResult=await page.evaluate(()=>({
                href:location.href,base:document.baseURI,
                script:document.querySelector('script[src*="word-trails-next-launcher"]')?.src,
                home:!!document.querySelector('#home #home-cross'),
                visiblePage:[...document.querySelectorAll('section')].filter(s=>getComputedStyle(s).display!=='none').slice(0,10).map(s=>s.id),
                probe:window.__wtHomeProbe||[]
              }));
              console.log('POST_TRAILS_HOME_CLICK',JSON.stringify(homeResult));
              await page.waitForFunction(()=>location.pathname.endsWith('/experiments/word-trails-next-v1.html'),{timeout:5000});
              const route=await page.evaluate(()=>({
                url:location.pathname,title:document.title,
                level:document.getElementById('level-label')?.textContent,
                tileCount:document.querySelectorAll('.board .tile').length,
                preserved:document.querySelector('.lab-tag')?.textContent
              }));
              console.log('TRAIL_HOME_DIRECT_ROUTE',JSON.stringify(route));
              assert(route.url.endsWith('word-trails-next-v1.html'));
              assert.equal(route.tileCount,15);
              assert(route.level.includes('LEVEL 1'),'Homepage should open directly into playable level 1');
              await page.goto('http://127.0.0.1:8766/index.html?trails=previous',{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForSelector('#wt-next-entry',{timeout:60000});
              await page.click('#home-cross');
              const legacy=await page.evaluate(()=>({
                pathname:location.pathname,
                panel:!!document.getElementById('cross-pick'),
                entry:!!document.getElementById('wt-next-entry')
              }));
              console.log('LEGACY_COMPARISON_ROUTE',JSON.stringify(legacy));
              assert(legacy.pathname.endsWith('/index.html'),'Explicit previous-version URL must preserve original selector');
              assert(legacy.panel&&legacy.entry);
              console.log('PASS homepage Trails routes straight to NEXT, optional old comparison preserved');
            }catch(e){console.error('FAIL',e.stack);process.exitCode=1}
            finally{await browser?.close()}
          })();
          JS