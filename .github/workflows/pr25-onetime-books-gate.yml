name: PR25 one-time Books gate patch (development branch only)
on:
  push:
    branches:
      - assistant/fix-books-gate-and-audio-parity-20261115
    paths:
      - .github/workflows/pr25-onetime-books-gate.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'basilejoseph325-jpg/Bible-Unfolded-Visual-Lab' && github.ref == 'refs/heads/assistant/fix-books-gate-and-audio-parity-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/fix-books-gate-and-audio-parity-20261115
          persist-credentials: true
      - name: Strict one-location HTML patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old=" if(home&&nativeOnce){nativeOnce=false;return;}\n event.preventDefault();\n event.stopImmediatePropagation();\n event.stopPropagation();\n window.location.assign(SHELF);"
          new=" if(home&&nativeOnce){nativeOnce=false;return;}\n // Guard the Books menu before any later click listeners: the standalone shelf\n // is unlocked only by the existing TEST James economy, not this router.\n if(home){\n  const economy=window.BUJamesReturnLoopV1;\n  if(!economy?.inspect?.()?.owned?.includes('books')){\n   event.preventDefault();\n   event.stopImmediatePropagation();\n   event.stopPropagation();\n   economy?.requestBookUnlock?.();\n   return;\n  }\n }\n event.preventDefault();\n event.stopImmediatePropagation();\n event.stopPropagation();\n window.location.assign(SHELF);"
          if s.count(old)!=1:
              raise SystemExit("Refusing non-unique or missing PR25 HTML patch")
          p.write_text(s.replace(old,new),encoding="utf-8")
          print("Patched only earliest Books route; input bytes:",len(s),"output:",len(s)+len(new)-len(old))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(TEST): enforce Books token gate in first HTML click handler'
          git push origin HEAD:assistant/fix-books-gate-and-audio-parity-20261115
