name: Publish Quick Play icon contrast correction (one-time)
on:
  push:
    paths:
      - .github/workflows/cache-bust-play-together-icons-v11.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and refresh nested and outer stylesheet versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected={
            'play-together-cinematic.css':'4cb8f19341a291585ef5cb1b11f8c6c1b39cbce2',
            'trivia-together-premium.css':'acf661c2891e3e4eb4dbaf7633e1a269f26e4160',
            'index.html':'293b5b518580d3d8208251a4f1783af12eaf8e7a'
          }
          for file,sha in expected.items():
            actual=subprocess.check_output(['git','hash-object',file],text=True).strip()
            assert actual==sha,(file,actual)
          css=Path('trivia-together-premium.css')
          s=css.read_text(encoding='utf-8')
          old='@import url("./play-together-cinematic.css?v=pt-gold-icons-study-compact-v10");'
          new='@import url("./play-together-cinematic.css?v=pt-quick-icons-contrast-v11");'
          assert s.count(old)==1
          css.write_text(s.replace(old,new),encoding='utf-8')
          html=Path('index.html')
          s=html.read_text(encoding='utf-8')
          old='trivia-together-premium.css?v=pt-gold-icons-study-compact-v10'
          new='trivia-together-premium.css?v=pt-quick-icons-contrast-v11'
          assert s.count(old)==1
          html.write_text(s.replace(old,new),encoding='utf-8')
          print('Updated exact stylesheet references; no other app logic touched')
          PY
          git rm -f .github/workflows/cache-bust-play-together-icons-v11.yml
          git add -- index.html trivia-together-premium.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Visual Lab: refresh Quick Play icon contrast CSS"
          git push origin HEAD:main
