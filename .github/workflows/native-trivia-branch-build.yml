name: Native Trivia V2 isolated branch integration

on:
  push:
    branches:
      - repair/native-trivia-v2-2026-10-30
    paths:
      - .github/workflows/native-trivia-branch-build.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Integrate approved V2 artwork inside the native Trivia controller
        run: python3 .github/scripts/apply_native_trivia_v2.py

      - name: Verify all inline JavaScript syntax and no iframe overlay
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('index.html', 'utf8');
          if (!s.includes('id="bu-trivia-native-landing-approved-v2"')) throw Error('Missing native marker');
          if (s.includes('id="realGame"')) throw Error('iframe overlay remains');
          if (!s.includes('bu3834-entry')) throw Error('Scholar Research entry missing');
          if (!s.includes("}else if(page==='browse'){")) throw Error('Topic browser removed');
          let n = 0;
          for (const m of s.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/g)) {
            const code = m[2];
            if (!code.trim()) continue;
            try { new Function(code); } catch (e) { throw Error('Inline script #' + n + ': ' + e.message); }
            n++;
          }
          if (n < 200) throw Error('Unexpectedly few scripts: ' + n);
          console.log('PASS: ' + n + ' inline scripts, no iframe, Scholar and topic routes retained');
          NODE

      - name: Commit only the replacement index on this repair branch
        run: |
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate Trivia V2 natively; no iframe or duplicate game"
          git push origin HEAD:repair/native-trivia-v2-2026-10-30
