name: QA TEST-only native full-game restore transaction v7
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-full-backup-transaction-v7.yml'
      - 'experiments/word-trails-native-full-backup-transaction-v7.js'
      - 'scripts/qa_word_trails_native_full_backup_transaction_v7.cjs'
      - 'scripts/qa_word_trails_native_full_backup_transaction_v7_real_browser.cjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  guarded-native-restore-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and unlinked TEST-only contract
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/word-trails-native-full-backup-transaction-v7.js
          node --check scripts/qa_word_trails_native_full_backup_transaction_v7.cjs
          for file in index.html visual-lab-test-banner.js journey-progress-caption.js word-trails-native-shell-v1.js bu-platform-saves-v2.js experiments/word-trails-next-v1.html experiments/word-trails-next-v1.js; do
            if grep -F 'word-trails-native-full-backup-transaction-v7.js' "$file"; then
              echo 'STOP: experimental v7 transaction is linked to a real player page' >&2
              exit 1
            fi
          done
      - name: Consent, journal, conflict, crash, wallet and lock synthetic cases
        run: node scripts/qa_word_trails_native_full_backup_transaction_v7.cjs
      - name: Install isolated Chrome driver
        run: npm install --prefix /tmp/wt-backup-v7-browser puppeteer-core@24 --silent --no-audit --no-fund
      - name: "Two real same-origin Chromium tabs: locked import and old-writer conflict"
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa_word_trails_native_full_backup_transaction_v7_real_browser.cjs
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/wt-backup-v7-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/wt-backup-v7-browser/node_modules node scripts/qa_word_trails_native_full_backup_transaction_v7_real_browser.cjs
