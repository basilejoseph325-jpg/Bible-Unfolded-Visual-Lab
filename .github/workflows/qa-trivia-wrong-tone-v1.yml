name: QA Trivia phone-audible negative tone with preserved correct chime
on:
  push:
    paths:
      - 'trivia-wrong-tone-repair-v1.js'
      - 'journey-progress-caption.js'
      - '.github/workflows/qa-trivia-wrong-tone-v1.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and no unrelated visuals altered
        shell: bash
        run: |
          set -euo pipefail
          node --check trivia-wrong-tone-repair-v1.js
          node --check trivia-stone-press-v1.js
          node --check journey-progress-caption.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('trivia-wrong-tone-repair-v1.js').read_text()
          loader=Path('journey-progress-caption.js').read_text()
          press=Path('trivia-stone-press-v1.js').read_text()
          assert 'playChime=function balancedTriviaCorrectTone' in s
          assert 'previousCorrect.apply(this,args)' in s
          assert 'sfxVolume=Math.min(100,originalSetting*1.5)' in s
          assert 'bu3846WrongTone=function balancedTriviaWrongTone' in s
          assert '[392,329.63]' in s
          assert 'trivia-wrong-tone-repair-v1.js?v=20261106-phone-speaker-negative-v4' in loader
          assert 'trivia-stone-press-v1.js?v=20261106-pressed-feedback-v1' in loader
          assert 'trivia-photo-stone-tablets-v4.css?v=20261105-realstone-v4-footer-clearance' in loader
          assert "const selector='#bu34-trivia" in press
          print('PASS: original correct melody retained; wrong two-note cue boosted; stone visuals unchanged')
          PY
      - name: Simulate original correct chime boosted, wrong gain, slider, mute and other modes
        shell: bash
        run: |
          node <<'JS'
          const vm=require('node:vm'),fs=require('node:fs'),assert=require('node:assert/strict');
          const played=[],peaks=[],correctVolumes=[];
          const ac={
            state:'running',currentTime:10,destination:{},
            createOscillator(){const osc={frequency:{setValueAtTime(f){osc.hz=f}},connect(){},start(){played.push(osc.hz)},stop(){},disconnect(){}};return osc},
            createGain(){return {gain:{setValueAtTime(){},exponentialRampToValueAtTime(v){if(v>.001)peaks.push(v)}},connect(){},disconnect(){}}}
          };
          let playing=true,oldCorrect=0;
          const ctx={window:{},document:{hidden:false,readyState:'complete',addEventListener(){},
            getElementById(id){return id==='bu34-body'?{classList:{contains(){return playing}},querySelector(){return {}}}:null}},
            sfxOn:true,sfxVolume:65,
            bu3846WrongTone(){},
            playChime(){oldCorrect++;correctVolumes.push(ctx.sfxVolume)},
            audioContext(){return ac},setTimeout(){}};
          vm.runInNewContext(fs.readFileSync('trivia-wrong-tone-repair-v1.js','utf8'),ctx);
          assert.equal(ctx.window.BU_TRIVIA_FEEDBACK_AUDIO_V2.version,'2026-11-06-phone-audible-v4');
          ctx.playChime();
          assert.equal(oldCorrect,1);assert.equal(correctVolumes[0],97.5);
          assert.equal(ctx.sfxVolume,65,'global SFX slider setting was not restored');
          ctx.bu3846WrongTone();
          assert.deepEqual(played,[392,784,329.63,659.26]);
          assert(peaks[0]>.35&&peaks[0]<.40,'Negative cue is still too quiet');
          ctx.sfxVolume=20;ctx.playChime();ctx.bu3846WrongTone();
          assert.equal(correctVolumes[1],30);assert.equal(played.length,8);
          assert(peaks[4]>.20&&peaks[4]<peaks[0]);
          ctx.sfxOn=false;ctx.playChime();ctx.bu3846WrongTone();
          assert.equal(played.length,8);
          ctx.sfxOn=true;ctx.sfxVolume=0;ctx.playChime();ctx.bu3846WrongTone();
          assert.equal(played.length,8);
          ctx.sfxVolume=65;playing=false;ctx.playChime();
          assert.equal(correctVolumes[4],65,'Non-Trivia correct chime volume was altered');
          console.log('PASS: approved positive melody called with 1.5x temporary gain, negative louder, original setting restored, mute and other modes respected');
          JS
