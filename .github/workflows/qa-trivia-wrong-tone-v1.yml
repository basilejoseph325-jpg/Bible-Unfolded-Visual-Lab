name: QA Trivia existing wrong-answer two-note audio restoration
on:
  push:
    paths:
      - 'trivia-wrong-tone-repair-v1.js'
      - 'journey-progress-caption.js'
      - '.github/workflows/qa-trivia-wrong-tone-v1.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax, old sound path and zero changes to approved sinking effect
        shell: bash
        run: |
          set -euo pipefail
          node --check trivia-wrong-tone-repair-v1.js
          node --check trivia-stone-press-v1.js
          node --check journey-progress-caption.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('trivia-wrong-tone-repair-v1.js').read_text()
          loader=Path('journey-progress-caption.js').read_text()
          press=Path('trivia-stone-press-v1.js').read_text()
          assert 'bu3846WrongTone=restoredTriviaWrongTone' in s
          assert 'audioContext()' in s and '[392,329.63]' in s
          assert 'Number(sfxVolume)<=0' in s and '!sfxOn' in s
          assert 'playChime' not in s.replace('playChime,','')
          assert 'trivia-wrong-tone-repair-v1.js?v=20261106-original-soft-cue-v1' in loader
          assert 'trivia-stone-press-v1.js?v=20261106-pressed-feedback-v1' in loader
          assert 'trivia-photo-stone-tablets-v4.css?v=20261105-realstone-v4-footer-clearance' in loader
          assert "const selector='#bu34-trivia" in press
          print('PASS: isolated legacy Trivia tone repair and original stone press retained')
          PY
      - name: Simulate SFX toggle, audio context initialization and soft descending notes
        shell: bash
        run: |
          node <<'JS'
          const vm=require('node:vm'),fs=require('node:fs'),assert=require('node:assert/strict');
          const code=fs.readFileSync('trivia-wrong-tone-repair-v1.js','utf8');
          const played=[],peaks=[];let initialized=0,originalCalled=0;
          const ac={
            state:'running',currentTime:10,destination:{},
            createOscillator(){const osc={type:null,frequency:{setValueAtTime(f){osc.frequencyHz=f}},
              connect(){},start(t){played.push({hz:osc.frequencyHz,at:t})},stop(){},disconnect(){}};return osc;},
            createGain(){return{gain:{setValueAtTime(){},exponentialRampToValueAtTime(v){peaks.push(v)}},connect(){},disconnect(){}}}
          };
          const ctx={window:{},document:{hidden:false,readyState:'complete',addEventListener(){}},
            sfxOn:true,sfxVolume:65,
            bu3846WrongTone(){originalCalled++},
            audioContext(){initialized++;return ac},
            setTimeout(){}};
          vm.runInNewContext(code,ctx);
          ctx.bu3846WrongTone();
          assert.equal(initialized,1);
          assert.equal(originalCalled,0);
          assert.equal(played.length,2);
          assert.deepEqual(played.map(x=>x.hz),[392,329.63]);
          assert(peaks.some(v=>v>.04 && v<.075),'Wrong cue too quiet or too loud');
          ctx.sfxOn=false;ctx.bu3846WrongTone();assert.equal(played.length,2);
          ctx.sfxOn=true;ctx.sfxVolume=0;ctx.bu3846WrongTone();assert.equal(played.length,2);
          ctx.sfxVolume=65;ctx.document.hidden=true;ctx.bu3846WrongTone();assert.equal(played.length,2);
          console.log('PASS: same original two notes, no duplicate native tone, Effects/volume honored');
          JS
