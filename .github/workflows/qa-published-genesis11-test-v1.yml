name: QA published TEST Genesis Episode 11 10 scenes and native wheels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-published-genesis11-test-v1.yml'
      - 'bible_unfolded_core_part3.js'
      - 'bible_unfolded_core_part5.js'
      - 'story-adventure-art/genesis11/**'
      - 'scripts/qa_genesis11_complete_native_playpath_v1.cjs'
      - 'scripts/qa_genesis11_three_thinking_hints_v1.cjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  published-test-story:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Confirm GitHub Pages serves CURRENT Story release files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, time, urllib.request
          base='https://basilejoseph325-jpg.github.io/Bible-Unfolded-Visual-Lab/'
          paths=[
            'bible_unfolded_core_part1.js',
            'bible_unfolded_core_part2.js',
            'bible_unfolded_core_part3.js',
            'bible_unfolded_core_part5.js',
            'story-adventure-content/genesis-episode11-haran-v1.json'
          ]
          markers=[
            'bible_unfolded_core_part3.js?v=story-adventure-candidate-1',
            'bible_unfolded_core_part5.js?v=story-adventure-candidate-1'
          ]
          token=os.environ.get('GITHUB_SHA','release')[:12]
          for attempt in range(20):
            try:
              suffix='?published-story-check='+token+'-'+str(attempt)
              with urllib.request.urlopen(base+suffix,timeout=40) as r:
                html=r.read().decode('utf-8')
              if not all(marker in html for marker in markers):
                print('Pages HTML not yet on current Story build:',attempt+1)
              else:
                mismatches=[]
                for path in paths:
                  with urllib.request.urlopen(base+path+suffix,timeout=40) as r:
                    published=r.read()
                  expected=pathlib.Path(path).read_bytes()
                  if hashlib.sha256(published).digest()!=hashlib.sha256(expected).digest():
                    mismatches.append(path)
                if not mismatches:
                  print('PASS_PUBLIC_TEST_CURRENT_STORY_FILES',
                        len(html),'all',len(paths),'files match commit',token)
                  break
                print('Pages asset propagation pending:',attempt+1,','.join(mismatches))
            except Exception as e:
              print('Pages request pending:',attempt+1,str(e)[:160])
            time.sleep(9)
          else: raise SystemExit('Published TEST not yet consistent with this commit; no gameplay claim')
          PY
      - name: Run real Chrome through ten public Story wheels and thinking hints
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-genesis11-public-qa puppeteer-core@24 --silent --no-audit --no-fund
          export NODE_PATH=/tmp/bu-genesis11-public-qa/node_modules
          export STORY_URL='https://basilejoseph325-jpg.github.io/Bible-Unfolded-Visual-Lab/?genesis11=public-qa-v1'
          node scripts/qa_genesis11_complete_native_playpath_v1.cjs
          node scripts/qa_genesis11_three_thinking_hints_v1.cjs
          echo 'PASS_PUBLIC_TEST_GENESIS11_FULL_GAMEPLAY all 10 pictures, 10 solved word wheels, 3 contextual hints and resume'
