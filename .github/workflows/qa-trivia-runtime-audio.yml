name: QA Trivia louder richer wrong-answer cue V5 real browser test
on:
  push:
    paths:
      - '.github/workflows/qa-trivia-runtime-audio.yml'
      - 'trivia-wrong-tone-repair-v1.js'
      - 'journey-progress-caption.js'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Boot local Visual Lab and inspect actual Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || true
          mkdir -p /tmp/bu-qa
          npm install --prefix /tmp/bu-qa --no-audit --no-fund --silent puppeteer-core@24
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bu-server.log 2>&1 &
          sleep 2
          node <<'JS'
          const puppeteer=require('/tmp/bu-qa/node_modules/puppeteer-core');
          const {execSync}=require('child_process');
          (async()=>{
            let browser;
            try{
              const executablePath=execSync('command -v google-chrome || command -v chromium',{encoding:'utf8'}).trim();
              browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required']});
              const page=await browser.newPage();
              page.on('pageerror',e=>console.log('PAGEERROR',e.message.slice(0,500)));
              page.on('console',msg=>{if(msg.type()==='error')console.log('CONSOLE_ERROR',msg.text().slice(0,500))});
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:120000});
              await new Promise(r=>setTimeout(r,4500));
              const status=await page.evaluate(()=>{
                const f=window.BUStage16TriviaLifecycle;
                return {
                  page:location.href,
                  repair:window.BU_TRIVIA_WRONG_TONE_REPAIR_V1||null,
                  fn:typeof bu3846WrongTone,
                  fnSource:typeof bu3846WrongTone==='function'?String(bu3846WrongTone).slice(0,250):'none',
                  positiveSource:typeof playChime==='function'?String(playChime).slice(0,1100):'none',
                  triviaVisible:typeof bu34Visible==='function'?bu34Visible():null,
                  audioContext:typeof audioContext,
                  sfxOn:typeof sfxOn==='undefined'?'undefined':sfxOn,
                  sfxVolume:typeof sfxVolume==='undefined'?'undefined':sfxVolume,
                  facade:typeof BUStage16TriviaLifecycle,
                  wrongScript:!!document.getElementById('bu-trivia-wrong-tone-v1'),
                  wrongScriptUrl:document.getElementById('bu-trivia-wrong-tone-v1')?.src,
                  loader:!!document.querySelector('script[src*="journey-progress-caption.js"]'),
                  bodyReady:!!document.querySelector('#bu34-trivia'),
                  beginReady:!!document.getElementById('begin')
                };
              });
              console.log('RUNTIME_STATUS',JSON.stringify(status));
              if(!status.repair)throw new Error('Repair was not installed in real browser runtime');
              const tones=await page.evaluate(async()=>{
                const orig=window.AudioContext?.prototype?.createOscillator;
                let calls=0;
                if(orig)window.AudioContext.prototype.createOscillator=function(...a){calls++;return orig.apply(this,a)};
                try{
                  await new Promise(resolve=>{const btn=document.createElement('button');btn.textContent='test';btn.onclick=()=>{bu3846WrongTone();resolve()};document.body.appendChild(btn);btn.click();btn.remove()});
                  return {calls,contextState:typeof context!=='undefined'?context?.state:'missing'}
                }finally{if(orig)window.AudioContext.prototype.createOscillator=orig}
              });
              console.log('DIRECT_WRONG_TONE',JSON.stringify(tones));
              if(tones.calls!==6)throw new Error('Wrong tone must create two rich notes with three harmonics each');
              // Isolate the two sound generators before clicking an answer (avoids
              // the existing announcer/chime audio that starts after a correct answer).
              await page.evaluate(()=>BUStage16TriviaLifecycle.getStart()('quick','all'));
              const volumeProbe=await page.evaluate(()=>{
                const orig=window.AudioContext.prototype.createOscillator;
                const frequencies=[];
                const origGain=window.AudioContext.prototype.createGain;
                const oldSetting=sfxVolume,oldEnabled=sfxOn;
                let notes=0,peaks=[];
                window.AudioContext.prototype.createOscillator=function(...args){notes++;const osc=orig.apply(this,args);const start=osc.start.bind(osc);osc.start=function(...params){frequencies.push(osc.frequency.value);return start(...params)};return osc};
                window.AudioContext.prototype.createGain=function(...args){
                  const gain=origGain.apply(this,args),f=gain.gain.exponentialRampToValueAtTime.bind(gain.gain);
                  gain.gain.exponentialRampToValueAtTime=(v,t)=>{if(v>.001)peaks.push(v);return f(v,t)};
                  return gain;
                };
                function pair(volume,on){
                  sfxVolume=volume;sfxOn=on;const start=notes,at=peaks.length,fr=frequencies.length;
                  playChime();
                  const positiveNotes=notes-start,negativeAt=peaks.length,middle=notes;
                  bu3846WrongTone();
                  return {notes:notes-start,positiveNotes,negativeNotes:notes-middle,positive:peaks[at],negative:peaks[negativeAt],peaks:peaks.slice(at),frequencies:frequencies.slice(fr)};
                }
                try{
                  return {low:pair(20,true),high:pair(65,true),muted:pair(0,true),off:pair(65,false)};
                }finally{
                  sfxVolume=oldSetting;sfxOn=oldEnabled;
                  window.AudioContext.prototype.createGain=origGain;
                  window.AudioContext.prototype.createOscillator=orig;
                }
              });
              console.log('SLIDER_VOLUME_PROBE',JSON.stringify(volumeProbe));
              if(volumeProbe.low.positiveNotes<3||volumeProbe.low.negativeNotes!==6||volumeProbe.high.positiveNotes<3||volumeProbe.high.negativeNotes!==6||volumeProbe.muted.notes!==0||volumeProbe.off.notes!==0)
                throw new Error('Effects volume/mute did not control both chimes');
              if(!(volumeProbe.low.positive>.05&&volumeProbe.low.negative>.05&&
                   volumeProbe.high.positive>volumeProbe.low.positive&&volumeProbe.high.negative>volumeProbe.low.negative))
                throw new Error('Both chimes must be audible at 20% and scale with volume slider');
              if(!(volumeProbe.low.negative/volumeProbe.low.positive>3&&volumeProbe.high.negative/volumeProbe.high.positive>3))
                throw new Error('Positive and negative chimes are not balanced');
              const rendered=await page.evaluate(async()=>{
                const oldAudioContext=audioContext,oldSfx=sfxVolume,oldOn=sfxOn;
                const offline=new OfflineAudioContext(1,48000,48000);
                try{
                  audioContext=()=>offline;sfxVolume=20;sfxOn=true;
                  bu3846WrongTone();
                  const buffer=await offline.startRendering(),samples=buffer.getChannelData(0);
                  let sum=0,count=0,peak=0;
                  for(let i=2400;i<28800;i++){const v=samples[i];sum+=v*v;peak=Math.max(peak,Math.abs(v));count++;}
                  return {rms:Math.sqrt(sum/count),peak,seconds:buffer.duration};
                }finally{audioContext=oldAudioContext;sfxVolume=oldSfx;sfxOn=oldOn}
              });
              console.log('RENDERED_NEGATIVE_20',JSON.stringify(rendered));
              if(!(rendered.rms>.05&&rendered.peak>.10&&rendered.peak<1))
                throw new Error('Actually rendered 20% negative tone was silent, excessively quiet or clipping');
              const clickProbe=await page.evaluate(()=>{
                const facade=BUStage16TriviaLifecycle;
                const topicKeys=facade.getTopics();
                const topics=Array.isArray(topicKeys)?topicKeys.slice(0,6):Object.keys(topicKeys||{}).slice(0,6);
                const start=facade.getStart();
                let error;
                try{start('quick','all')}catch(e){error=String(e)}
                const quiz=facade.getQuiz();
                const q=quiz?.items?.[quiz.step];
                if(!q)return {started:false,error,topics,quizType:typeof quiz};
                const wrong=Array.from({length:q.choices.length},(_,i)=>i).find(i=>i!==q.correct);
                const elem=document.querySelector('#bu34-trivia [data-answer="'+wrong+'"]');
                const orig=window.AudioContext.prototype.createOscillator;
                let oscillatorCalls=0;
                window.AudioContext.prototype.createOscillator=function(...args){oscillatorCalls++;return orig.apply(this,args)};
                try{
                  if(elem)elem.click();else facade.getChoose()(wrong);
                  return {started:true,wrong,correct:q.correct,domButton:!!elem,oscillatorCalls,afterAnswered:quiz.answered,wrongCount:quiz.bu383State?.[quiz.step]?.wrong??null,topics};
                }finally{window.AudioContext.prototype.createOscillator=orig}
              });
              console.log('ACTUAL_TRIVIA_WRONG_CLICK',JSON.stringify(clickProbe));
              if(!clickProbe.started||clickProbe.oscillatorCalls!==6)throw new Error('Real wrong-answer click must generate both rich notes with three partials');
              const correctProbe=await page.evaluate(()=>{
                const facade=BUStage16TriviaLifecycle,quiz=facade.getQuiz(),q=quiz?.items?.[quiz.step];
                if(!q)return {started:false};
                const element=document.querySelector('#bu34-trivia [data-answer="'+q.correct+'"]');
                const orig=window.AudioContext.prototype.createOscillator;
                let oscillatorCalls=0;
                window.AudioContext.prototype.createOscillator=function(...args){oscillatorCalls++;return orig.apply(this,args)};
                try{
                  if(element)element.click();else facade.getChoose()(q.correct);
                  return {started:true,domButton:!!element,oscillatorCalls,afterAnswered:quiz.answered,score:quiz.score};
                }finally{window.AudioContext.prototype.createOscillator=orig}
              });
              console.log('ACTUAL_TRIVIA_CORRECT_CLICK',JSON.stringify(correctProbe));
              if(!correctProbe.started||correctProbe.oscillatorCalls<3||!correctProbe.afterAnswered)
                throw new Error('Real correct-answer click must trigger at least 3 oscillator notes and complete the question');

              console.log('PASS real Trivia buttons, stronger negative cue with phone-speaker partials, correct melody preserved, slider and mute');

            }catch(e){console.error('FAIL',e.stack);process.exitCode=1}
            finally{if(browser)await browser.close()}
          })();
          JS
