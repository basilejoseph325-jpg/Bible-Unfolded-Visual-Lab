name: Inspect Native Purchased Wheel Rendering
on:
  push:
    paths: ['.github/workflows/inspect-native-wheel-effects.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect wheel visuals and original gesture code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('index.html'),Path('bible_unfolded_core_part5.js')]
          terms=[
            ('native-theme','sea-wheel'),
            ('curved-trace','quadraticCurveTo'),
            ('curve-cubic','bezierCurveTo'),
            ('svg-curve','createElementNS'),
            ('glitter','glitter'),
            ('wheel-sparks','sparkle'),
            ('wheel','wheel-path'),
            ('wheel-select','wheel-letter'),
            ('wheel-glow','wheel-glow'),
            ('trail','trail-path'),
            ('selection','selection-line'),
            ('ocean','seawheel')
          ]
          html=files[0].read_text(errors='replace')
          for start,end in [
            ('<style id="bu3821-wheel-finishes">','</style>'),
            ('<style id="bu3822-fluid-wheel-css">','</style>')
          ]:
            a=html.index(start);b=html.index(end,a)+len(end)
            print('COMPLETE_NATIVE_CSS',start,'AT',a,repr(html[a:b][:9600]))
          for token in ['bu3822Render','bu3822','bu3821Trace','bu3821','quadraticCurveTo']:
            indexes=[m.start() for m in re.finditer(re.escape(token),html)]
            last=[p for p in indexes if p>1500000]
            print('NATIVE_JS_TOKEN',token,'COUNT',len(indexes),'JS_COUNT',len(last))
            for p in last[:2]:
              print('NATIVE_JS_CONTEXT',token,'AT',p,repr(html[max(0,p-1700):p+5200][:6800].replace('\\n',' ')))
          PY