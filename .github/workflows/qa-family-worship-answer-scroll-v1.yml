name: QA real Family Worship four answer-result modes
on:
  push:
    paths:
      - '.github/workflows/qa-family-worship-answer-scroll-v1.yml'
      - 'family-worship-answer-scroll-v1.js'
      - 'family-worship-answer-scroll-v1.css'
      - 'journey-progress-caption.js'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check exact scroll art and source modules
        shell: bash
        run: |
          set -euo pipefail
          node --check family-worship-answer-scroll-v1.js
          node --check journey-progress-caption.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for p,h in {'assets/ui/daily-discovery-explanation-scroll-v3.webp':'4e25223d5666397a3a9dc9b446e4262d12fc41a2','assets/ui/daily-explanation-wax-next-v2.svg':'103af90347ddb90bcd23cbe0013563373dbc4fde'}.items():
            b=Path(p).read_bytes()
            assert hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()==h,p
          s=Path('family-worship-answer-scroll-v1.js').read_text()
          loader=Path('journey-progress-caption.js').read_text()
          assert all(("'"+m+"'") in s for m in ('trivia','lightning','words','story'))
          assert 'all-four-answer-modes-v2' in loader
          assert 'family-worship-picker-gallery-v3.js' in loader
          print('PASS original V3 art, wax, frozen Family Worship setup and four result phases')
          PY
      - name: Real mobile Family Worship gameplay and progress regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/fw-four-paths --no-audit --no-fund --silent puppeteer-core@24
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fw-four-http.log 2>&1 &
          sleep 2
          node <<'JS'
          const puppeteer=require('/tmp/fw-four-paths/node_modules/puppeteer-core');
          const {execSync}=require('child_process'), assert=require('node:assert/strict');
          (async()=>{
            let browser;
            try{
              const executablePath=execSync('command -v google-chrome || command -v chromium',{encoding:'utf8'}).trim();
              browser=await puppeteer.launch({headless:true,executablePath,args:['--no-sandbox','--disable-setuid-sandbox']});
              const page=await browser.newPage();
              await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true,deviceScaleFactor:2});
              page.setDefaultTimeout(20000);
              page.on('dialog',d=>d.accept());
              page.on('pageerror',e=>console.log('PAGE_ERROR',e.message.slice(0,200)));
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:120000});
              await new Promise(r=>setTimeout(r,2500));
              assert(await page.evaluate(()=>typeof bu35Begin==='function'&&typeof window.bu67Modal==='function'));
              async function begin(mode){
                await page.evaluate(mode=>{
                  document.getElementById('bu67-modal')?.close();
                  if(bu35Game)bu35Game.complete=true;
                  bu35Open('setup');
                  bu35Setup.people=['Joe','Britt'];bu35Setup.quick=mode;bu35Setup.topic='genesis';
                  bu35Setup.minutes=20;bu35Setup.order='classic';bu35Setup.difficulty='beginner';
                  bu35Begin();
                },mode);
                await page.waitForSelector('#bu35-ready');
                await page.evaluate(()=>document.querySelector('#bu35-ready')?.click());
                const state=await page.evaluate(()=>({phase:bu35Phase(),handOff:bu35Game.handOff,
                  phaseIndex:bu35Game.phase,phases:bu35Game.phases,answers:document.querySelectorAll('#bu35-body [data-answer]').length,
                  ready:!!document.getElementById('bu35-ready'),html:document.getElementById('bu35-body')?.innerHTML.slice(0,800)}));
                console.log('BEGIN_STATE',JSON.stringify(state));
              }
              async function result(phase,needle){
                await page.waitForSelector('#bu67-modal.bu-fw-answer-scroll .bu-fw-answer-scroll-return');
                const o=await page.evaluate(()=>{
                  const dlg=document.getElementById('bu67-modal'),b=dlg.querySelector('.bu67-dialog-body');
                  const wax=dlg.querySelector('.bu-fw-answer-scroll-return'),x=dlg.querySelector('.bu67-dialog-x');
                  const r=el=>{const a=el.getBoundingClientRect();return {top:a.top,bottom:a.bottom}};
                  return {open:dlg.open,phase:document.querySelector('#bu35-family').dataset.bu67Phase,
                    text:b.textContent,title:dlg.querySelector('strong').textContent,
                    art:getComputedStyle(dlg).backgroundImage,seal:getComputedStyle(wax).backgroundImage,
                    waxLabel:wax.textContent.trim(),next:document.querySelector('#bu35-nextturn')?.textContent.trim(),
                    card:r(dlg),wax:r(wax),x:r(x),view:innerHeight,scroll:b.scrollHeight,client:b.clientHeight};
                });
                console.log('RESULT_'+phase.toUpperCase(),JSON.stringify({...o,text:o.text.slice(0,150)}));
                assert.equal(o.open,true);assert.equal(o.phase,phase);
                assert(o.text.includes(needle),"Missing expected answer wording: "+needle);
                assert(o.art.includes('daily-discovery-explanation-scroll-v3.webp'));
                assert(o.seal.includes('daily-explanation-wax-next-v2.svg'));
                assert(o.next.startsWith(o.waxLabel),"Wax must match original next-turn action");
                assert(o.waxLabel!=='Return to Game');
                assert(o.card.bottom<=o.view&&o.wax.bottom<o.card.bottom-50);
                assert(o.x.top<o.card.bottom-160);
                return o;
              }
              async function advance(){
                const n=await page.evaluate(()=>bu35Game.completedTurns);
                await page.click('#bu67-modal .bu-fw-answer-scroll-return');
                await page.waitForFunction(n=>bu35Game.completedTurns===n+1,{},n);
                return page.evaluate(()=>({turn:bu35Game.turn,round:bu35Game.round,completed:bu35Game.completedTurns}));
              }
              async function choose(right){
                const i=await page.evaluate(right=>{
                  const q=bu35Question();
                  return right?q.correct:(q.correct+1)%q.choices.length;
                },right);
                const state=await page.evaluate(()=>({q:bu35Question().q,phase:bu35Phase(),num:document.querySelectorAll('#bu35-body [data-answer]').length,handOff:bu35Game.handOff}));
                console.log('BEFORE_CHOOSE',JSON.stringify(state));
                const hit=await page.evaluate(i=>{
                  const b=document.querySelector('#bu35-body [data-answer="'+i+'"]');
                  if(!b)throw Error('Missing native answer button');
                  const r=b.getBoundingClientRect();
                  const top=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);
                  const snapshot={rect:{x:r.x,y:r.y,width:r.width,height:r.height},
                    hit:top?.id||top?.className,hidden:b.hidden,disabled:b.disabled};
                  b.click();return snapshot;
                },i);
                console.log('NATIVE_CHOICE',JSON.stringify(hit));
              }
              async function solveWord(){
                await page.evaluate(()=>{
                  const word=bu35Word(),tiles=bu35Game.wordTiles,used=new Set();
                  bu35Game.wordSelection=[...word].map(c=>{
                    const i=tiles.findIndex((x,n)=>x===c&&!used.has(n));
                    if(i<0)throw Error('Incorrect word bank '+word);
                    used.add(i);return i;
                  });
                  bu35Render();
                });
                await page.evaluate(()=>document.querySelector('#bu35-check')?.click());
              }
              // Trivia: correct, wrong and skipped (native handlers, real questions).
              await begin('trivia');
              await choose(true);await result('trivia','Correct!');
              assert.equal((await advance()).completed,1);
              await page.evaluate(()=>document.querySelector('#bu35-ready')?.click());await choose(false);await result('trivia','Answer:');
              await page.click('#bu67-modal .bu67-dialog-x');
              assert.equal(await page.evaluate(()=>bu35Game.completedTurns),1);
              await page.evaluate(()=>document.querySelector('#bu35-body .bu67-open-details')?.click());
              await result('trivia','Answer:');
              assert.equal((await advance()).completed,2);
              await page.evaluate(()=>document.querySelector('#bu35-ready')?.click());await page.evaluate(()=>document.querySelector('#bu35-skip')?.click());
              await result('trivia','Answer:');assert.equal((await advance()).completed,3);
              console.log('PASS_TRIVIA correct/wrong/skip and closed X does not advance');
              // Lightning (session-only mode), use real answer handler and nextturn.
              await begin('trivia');
              await page.evaluate(()=>{
                bu35Game.phases=['lightning','finish'];bu35Game.phase=0;bu35Game.handOff=true;
                bu35Game.turn=0;bu35Game.round=0;bu35Game.answered=false;bu35Render();
              });
              await page.evaluate(()=>document.querySelector('#bu35-ready')?.click());await choose(false);
              await result('lightning','Answer:');assert.equal((await advance()).completed,1);
              console.log('PASS_LIGHTNING wrong answer');
              // Word Relay: skip, re-open, correct solve and new-player turn.
              await begin('words');await page.evaluate(()=>document.querySelector('#bu35-skip')?.click());
              await result('words','Word:');
              await page.click('#bu67-modal .bu67-dialog-x');
              assert.equal(await page.evaluate(()=>bu35Game.completedTurns),0);
              await page.evaluate(()=>document.querySelector('#bu35-body .bu35-feedback')?.click());
              await result('words','Word:');
              assert.equal((await advance()).completed,1);
              await page.evaluate(()=>document.querySelector('#bu35-ready')?.click());await solveWord();
              await result('words','Discovered!');
              assert.equal((await advance()).completed,2);
              console.log('PASS_WORD_RELAY skipped/correct/reopen and real next turn');
              // Story: real correctly solved word and skipped puzzle.
              await begin('story');await solveWord();
              await result('story','Discovered!');
              const link=await page.evaluate(()=>document.querySelector('#bu67-modal .bu35-scripture')?.href);
              assert(link?.startsWith('https://www.jw.org/'));
              assert.equal((await advance()).completed,1);
              await page.evaluate(()=>document.querySelector('#bu35-ready')?.click());await page.evaluate(()=>document.querySelector('#bu35-skip')?.click());
              await result('story','Word:');
              await page.click('#bu67-modal .bu67-dialog-x');
              await page.evaluate(()=>{
                const f=document.querySelector('#bu35-body .bu35-feedback');
                f.append(document.createTextNode(' A very long explanation. '.repeat(170)));
                f.click();
              });
              const long=await result('story','A very long explanation');
              assert(long.scroll>long.client+50,'Long text must scroll inside the parchment');
              assert.equal((await advance()).completed,2);
              console.log('PASS_STORY correct/skip/JW link/long text/next player');
              // Non-answer modes must retain their existing UI. No fake scrolls.
              await page.evaluate(()=>{
                bu35Game.phases=['wheel','think','finish'];bu35Game.phase=0;
                bu35Game.wheelChoice=0;bu35Game.wheelPrompt={type:'Family Sharing',q:'How can we help?'};
                bu35Render();
              });
              assert(await page.evaluate(()=>!!document.querySelector('#bu35-family .bu35-result')));
              assert(!await page.evaluate(()=>document.getElementById('bu67-modal')?.open));
              await page.evaluate(()=>{bu35Game.phase=1;bu35Render();});
              assert(!await page.evaluate(()=>document.getElementById('bu67-modal')?.open));
              await page.evaluate(()=>{bu35Game.phase=2;bu35Render();});
              assert(await page.evaluate(()=>!!document.querySelector('#bu35-family .bu35-rank')));
              assert(!await page.evaluate(()=>document.getElementById('bu67-modal')?.open));
              await page.evaluate(()=>bu35Open('setup'));
              await page.waitForFunction(()=>document.getElementById('bu35-family')?.classList.contains('bu-fw-gathering'));
              console.log('PASS_UNSCORED wheel/discussion/results remain unchanged; setup frozen');
              console.log('PASS ALL FOUR FAMILY WORSHIP ANSWER MODES WITH REAL INTERACTION AND NEXT TURN');
            }catch(e){console.error('FAIL',e.stack);process.exitCode=1}
            finally{if(browser)await browser.close()}
          })();
          JS
