name: QA TEST native Word Trails 30 levels in WebKit narrow phone viewports v12
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-all30-webkit-v12.yml'
      - 'scripts/qa_word_trails_all30_webkit_viewport_v12.cjs'
      - 'experiments/word-trails-next-v1.js'
      - 'experiments/word-trails-next-v1.html'
      - 'experiments/word-trails-next-v1.css'
      - 'experiments/word-trails-levels-12-30-v1.js'
      - 'word-trails-native-shell-v1.js'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-levels-and-viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Validate test code
        run: node --check scripts/qa_word_trails_all30_webkit_viewport_v12.cjs
      - name: Install isolated WebKit browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-wt-all30-v12 playwright@latest --silent --no-audit --no-fund
          /tmp/bu-wt-all30-v12/node_modules/.bin/playwright install --with-deps webkit
      - name: Navigate all 30 levels via real TEST UI and verify saved position
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/bu-wt-all30-v12.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-wt-all30-v12/node_modules node scripts/qa_word_trails_all30_webkit_viewport_v12.cjs
          echo 'PASS only represents automated Linux WebKit; physical iPhone and Samsung testing remain required.'
