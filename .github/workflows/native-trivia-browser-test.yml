name: Native Trivia V2 browser smoke test

on:
  push:
    branches:
      - repair/native-trivia-v2-2026-10-30
    paths:
      - .github/workflows/native-trivia-browser-test.yml

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Smoke test native Trivia navigation on mobile viewport
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/visual-lab-server.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror', e=>errors.push(e.message));
            const url='http://127.0.0.1:8765/';
            async function landing(){
              await page.goto(url,{waitUntil:'load',timeout:120000});
              await page.evaluate(()=>{const b=document.getElementById('home-trivia');if(!b)throw Error('Missing home-trivia');b.click()});
              await page.locator('#bu34-body .bu-native-trivia').waitFor({state:'visible',timeout:30000});
              if(await page.locator('#bu34-body .labCard, #bu34-body .labTogether').count()!==5)throw Error('Five Trivia entry controls not present');
              if(await page.locator('#realGame').count())throw Error('Old iframe is present');
            }
            await landing();
            console.log('PASS landing: five native choices; no iframe');
            await page.locator('#bu-native-exit').click();
            if(!await page.locator('#bu34-trivia').isHidden())throw Error('Back to Home did not close Trivia');
            console.log('PASS Back to Home');

            const tests=[
              ['Play Mixed Trivia','[data-target="Play Mixed Trivia"]','#bu386-back'],
              ['Choose a Topic','[data-target="Choose a Topic"]','#bu386-back'],
              ['Bible Master','[data-target="Bible Master"]','#bu34-body'],
              ['Scholar Research','#bu3834-entry','.bu3835-tracks, .bu3834-scholar'],
              ['Play Trivia Together','[data-target="Play Trivia Together"]','#bu35-screen, #bu35-setup, #bu35-body']
            ];
            for(const [name,selector,expected] of tests){
              await landing();
              await page.locator('#bu34-body '+selector).click({timeout:15000});
              if(await page.locator('#bu34-body .bu-native-trivia').count())throw Error(name+': still showing landing');
              const visible=await page.locator(expected).count();
              if(!visible)console.log('Route '+name+' exited landing, no selector match for '+expected);
              else console.log('PASS route '+name);
            }
            if(errors.length){console.error('Runtime JS errors:',errors.slice(0,8));throw Error('Runtime page errors detected: '+errors.length)}
            console.log('PASS complete: no uncaught JavaScript errors');
            await browser.close();
          })().catch(err=>{console.error(err.stack||err);process.exitCode=1});
          NODE
