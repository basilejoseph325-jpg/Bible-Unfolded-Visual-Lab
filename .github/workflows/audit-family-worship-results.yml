name: Read-only audit Family Worship answer and results UI
on:
  push:
    paths: ['.github/workflows/audit-family-worship-results.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Examine Family Worship result lifecycle and existing details modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(errors='replace')
          terms=['function bu35Render(', 'bu35Render=', 'bu35Render =', 'function bu35Choose', 'function bu35Answer','function bu35Next', 'function familyInfo(', 'function modal(', 'bu67-dialog', 'bu67-open-details', 'function bu35Finish', 'bu35-feedback','bu35-result','bu35-recap','bu35-phase']
          for q in terms:
            offsets=[]
            pos=-1
            while True:
              pos=s.find(q,pos+1)
              if pos<0:break
              offsets.append(pos)
            print('TERM',q,'COUNT',len(offsets),'OFFSETS',offsets[:22])
            # Only code fragments near end for functions and result state.
            for n,i in enumerate(offsets):
              if q=='bu35-feedback' and i<1000000:continue
              if q in ('bu67-dialog','bu67-open-details') and i<1000000:continue
              if q=='bu35-result' and i<1000000:continue
              if q=='bu35-phase' and i<1000000:continue
              if n>=4:break
              start=max(0,i-400)
              print('DETAIL',q,n,s[start:i+6800].replace(chr(10),'\\n')[:7200])
          PY