name: QA Daily 60 and Crosswords 30 actual player path
on:
  push:
    paths:
      - 'daily-discovery-insights-content-test-v1.js'
      - 'daily-discovery-meaningful-test-v1.js'
      - 'crossword-scripture-packs-22-to-30-test-v1.js'
      - 'word-trails-next-launcher.js'
      - 'journey-progress-caption.js'
      - 'scripts/qa_daily60_crosswords30_player_path_v1.cjs'
      - '.github/workflows/qa-daily60-crosswords30-player-path-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-player-path:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Check new content and browser test parse
        run: |
          node --check daily-discovery-insights-content-test-v1.js
          node --check crossword-scripture-packs-22-to-30-test-v1.js
          node --check word-trails-next-launcher.js
          node --check scripts/qa_daily60_crosswords30_player_path_v1.cjs
      - name: Run actual Chrome native home-to-new-game test
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-daily60-cross30-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/bu-daily60-cross30-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-daily60-cross30-qa/node_modules node scripts/qa_daily60_crosswords30_player_path_v1.cjs
