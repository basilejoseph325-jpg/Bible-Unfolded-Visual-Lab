name: Genesis 12 development wheel smoke (no deployment)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'story-adventure-content/genesis-episode12-*'
      - 'journey-progress-caption.js'
      - 'scripts/qa_genesis12_*'
      - '.github/workflows/qa-genesis12-dev.yml'
permissions:
  contents: read
jobs:
  preview-wheel:
    if: github.repository == 'basilejoseph325-jpg/Bible-Unfolded-Visual-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix work --no-audit --no-fund puppeteer-core@25.17.0
      - name: Start isolated local server
        run: |
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          python3 -m http.server 8893 --bind 127.0.0.1 > work/http-ep12.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8893/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check Genesis 12 sourced puzzle structure
        run: node scripts/qa_genesis12_content_candidate.cjs
      - name: Play Genesis 12 with actual native wheel in Chromium, two phone sizes
        env:
          NODE_PATH: '${{ github.workspace }}/work/node_modules'
        run: node scripts/qa_genesis12_native_preview.cjs
