name: QA Word Trails current 30-level and native entry checkpoint
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-word-trails-resume-20261114.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  all30-native-audio:
    uses: ./.github/workflows/qa-word-trails-30-voice.yml
  content-and-route:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate 30 existing puzzle layouts, Bible word assets and native browser routing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/word_trails_quality_gate.mjs
          node scripts/qa_word_trails_public_native_route_v36.cjs
          node --check word-trails-next-launcher.js
          node --check experiments/word-trails-next-v1.js
          node --check experiments/word-trails-announcer-v1.js
          echo "PASS_WT_CURRENT_TEST_BASELINE source and native route protected; no gameplay data modified"
