name: QA Word Trails FEEL LAB v2 controls rewards and phones
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-feel-v2.yml'
      - 'experiments/word-trails-feel-v2.js'
      - 'experiments/word-trails-feel-v2.css'
      - 'experiments/word-trails-next-v1.js'
      - 'experiments/word-trails-next-v1.html'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated original sound and visual polish assets
        run: |
          node --check experiments/word-trails-feel-v2.js
          node --check experiments/word-trails-next-v1.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('experiments/word-trails-feel-v2.js').read_text()
          main=Path('experiments/word-trails-next-v1.js').read_text()
          html=Path('experiments/word-trails-next-v1.html').read_text()
          css=Path('experiments/word-trails-feel-v2.css').read_text()
          assert "word-trails-feel-v2.js" in html
          assert "word-trails-feel-v2.css" in html
          assert html.index('word-trails-feel-v2.js')<html.index('word-trails-next-v1.js')
          assert "window.BUWTPolish=Object.freeze(" in js
          assert 'AudioContext' in js and 'oscillator' not in js.lower() or 'createOscillator' in js
          assert "satchel:" in main
          assert "Visual Lab" in js
          assert "word-trails-next-v1" in html
          assert "prefers-reduced-motion" in css
          assert "pointer-events:none" in css
          assert "FEATURE_CUE_BOOST=3.25" in js
          assert "return kind==='complete'?1.05:FEATURE_CUE_BOOST" in js
          assert "pluck(1568,.59,.17,.007,'sine')" in js, "Reward cues need their own higher-loudness mix"
          assert "const QUIET_CUES=new Set(['touch','trace','undo'])" in js, "Preserve swipe/tap/undo"
          assert "function celebrateWin()" in js and "winConfetti(stage,58)" in js and "winGlitter(stage,27)" in js
          assert 'id="finish-fx"' in html and "finish-fx" in css
          assert "window.BUWTPolish?.celebrateWin?.(milestone&&!already)" in main
          print("PASS separate quiet gameplay sounds and premium win-only glitter")
          assert "EFFECTS_MIX_GAIN=11.2" in js, "Master gain preserved across the voice normalization change"
          assert "VOICE_LOUDNESS_BOOST=4.0" in js
          assert "FEATURE_CUE_BOOST=3.25" in js
          assert "QUIET_CUES=new Set(['touch','trace','undo'])" in js
          assert "g.gain.exponentialRampToValueAtTime(Math.max(.00007,peak*.81)" in js
          assert "function celebrateWin()" in js and "function clearWinFX()" in js
          assert ".wt-win-foil" in css and ".wt-win-glint" in css
          assert "getFloatTimeDomainData" in js and "signalMeter" in js
          assert 'Reload resumes this same Word Trails puzzle' in html, "Reload should retain the game and its saved progress"
          assert "master.gain.value=EFFECTS_MIX_GAIN" in js
          assert "createDynamicsCompressor()" in js
          assert "createWaveShaper()" in js and "peakGuard.curve=curve" in js, "Layered notes need a soft peak ceiling"
          assert "haptic([38,58,36,75,70])" in main, "Win-only haptic should be more celebratory" 
          assert "cue('correct');haptic(15)" in main, "Ordinary correct-answer haptic must stay subtle"
          assert "case 'wordSettle'" in js and "case 'coinLand'" in js
          assert "case 'undo'" in js and "case 'levelEnter'" in js
          assert "cue('levelEnter')" in main
          print('PASS isolated source and original synthesis; no copied commercial sound effects')
          PY
      - name: Verify independent settings, coin travel, reward satchel, replay, reduced motion
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-feel-v2 puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8876 --bind 127.0.0.1 >/tmp/bu-feel-v2-http.log 2>&1 &
          sleep 1
          node <<'JS'
          const puppeteer=require('/tmp/bu-feel-v2/node_modules/puppeteer-core');
          const assert=require('node:assert/strict');
          const {execSync}=require('node:child_process');
          (async()=>{
            let browser;
            try{
              browser=await puppeteer.launch({headless:true,executablePath:execSync('command -v google-chrome || command -v chromium',{encoding:'utf8'}).trim(),
                args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required']});
              const page=await browser.newPage();
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.setViewport({width:390,height:705,isMobile:true,hasTouch:true,deviceScaleFactor:2});
              await page.goto('http://127.0.0.1:8876/experiments/word-trails-next-v1.html',{waitUntil:'networkidle0',timeout:120000});
              const $=async sel=>page.$eval(sel,el=>el.textContent);
              const openSettings=async()=>{
                await page.click('#audio');
                await page.waitForSelector('#wt-unified-menu[open]',{timeout:10000});
                await page.click('#wt-unified-menu [data-wt-menu="settings"]');
                await page.waitForSelector('#wt-main-settings[open]');
                await page.click('#wt-more-sounds');
                await page.waitForSelector('#wt-feel-settings[open]',{timeout:10000});
              };
              const check=await page.evaluate(()=>({
                api:!!window.BUWTPolish,settings:!!document.querySelector('#wt-feel-settings'),
                motion:document.querySelector('#app').dataset.motion,
                coin:document.querySelector('#points').textContent,
                tiles:document.querySelectorAll('.tile').length,
                sounds:window.BUWTPolish?.state()
              }));
              console.log('START',JSON.stringify(check));
              assert(check.api&&check.settings&&check.coin==='60'&&check.tiles===15);
              assert.equal(check.motion,'on');
              assert(check.sounds.music&&check.sounds.sfx&&check.sounds.motion);
              const mix=await page.evaluate(()=>window.BUWTPolish.mixGain());
              console.log('ANOTHER_FOUR_X_SFX_MASTER',JSON.stringify({before:2.8,after:mix,ratio:mix/2.8}));
              assert.equal(mix/2.8,4,'The protected audio master remains unchanged');
              const voice=await page.evaluate(()=>window.BUWTPolish.voiceBoost());
              console.log('SFX_VOICE_BOOST',JSON.stringify({relativeToPrevious:voice,master:mix}));
              assert.equal(voice,4,'Individual sound voices must retain previous baseline');
              const boosts=await page.evaluate(()=>Object.fromEntries(
                ['touch','trace','undo','correct','bonus','wrong','hint','spark','vault','complete','wordSettle','coinLand','shuffle','levelEnter']
                 .map(kind=>[kind,window.BUWTPolish.featureBoost(kind)])
              ));
              console.log('SELECTIVE_AUDIO_PROFILE',JSON.stringify(boosts));
              assert.equal(boosts.touch,1);
              assert.equal(boosts.trace,1);
              assert.equal(boosts.undo,1);
              for(const name of ['correct','bonus','wrong','hint','spark','vault','wordSettle','coinLand','shuffle','levelEnter'])
                assert(boosts[name]>=3,'Approved game feedback must retain full volume: '+name);
              assert(boosts.complete<=1.2&&boosts.complete>=.7,'Only the victory cue should be remastered down to avoid fuzziness');
              const cueMix=await page.evaluate(()=>Object.fromEntries(
                ['touch','trace','undo','correct','bonus','wrong','hint','complete','spark','coinLand','levelEnter']
                .map(kind=>[kind,window.BUWTPolish.featureBoost(kind)])));
              console.log('INDEPENDENT_FEEDBACK_LEVELS',JSON.stringify(cueMix));
              for(const name of ['touch','trace','undo'])assert.equal(cueMix[name],1,name+' must not be boosted');
              for(const name of ['correct','bonus','wrong','hint','spark','coinLand','levelEnter'])
                assert(cueMix[name]>=3,name+' must retain the approved strong gain');
              assert(cueMix.complete===1.05,'Win chime is intentionally re-mastered for less distortion');
              const measure=async pct=>page.evaluate(async pct=>{
                const prefs=window.BUWTPolish;
                const panel=document.querySelector('#wt-feel-settings [data-pref="sfxVolume"]');
                // This test uses the settings screen once it is opened below; here the volume
                // is changed via that exact same input and its real change handler.
                panel.value=String(pct);panel.dispatchEvent(new Event('change',{bubbles:true}));
                prefs.cue('touch');
                let peak=0,rms=0,state='unknown';
                for(let i=0;i<22;i++){
                  await new Promise(r=>setTimeout(r,12));
                  const x=prefs.audioMeter();
                  peak=Math.max(peak,x.peak);rms=Math.max(rms,x.rms);state=x.state;
                }
                return {peak,rms,state,volume:pct};
              },pct);
              await page.evaluate(()=>{
                const cues=['touch','undo','trace','wordSettle','coinLand','levelEnter'];
                for(const cue of cues)window.BUWTPolish.cue(cue);
              });
              await openSettings();
              const settingsShot=(await page.screenshot({type:'jpeg',quality:56})).toString('base64');
              for(let i=0;i<settingsShot.length;i+=8000)
                console.log('FEEL_SETTINGS_SHOT_'+(i/8000)+' '+settingsShot.slice(i,i+8000));
              const panel=await page.evaluate(()=>({
                options:[...document.querySelectorAll('#wt-feel-settings [data-pref]')].map(x=>x.dataset.pref),
                sample:[...document.querySelectorAll('#wt-feel-settings [data-demo]')].map(x=>x.dataset.demo)
              }));
              console.log('SOUND_PANEL',JSON.stringify(panel));
              assert.deepEqual(panel.options,['music','musicVolume','sfx','sfxVolume','motion','haptics']);
              assert.deepEqual(panel.sample,['trace','correct','bonus','complete']);
              const quiet=await measure(25),loud=await measure(100);
              console.log('REAL_AUDIO_OUTPUT',JSON.stringify({quiet,loud,ratio:loud.peak/(quiet.peak||0.00001)}));
              assert.equal(loud.state,'running','AudioContext must really run when playing sound effects');
              assert(loud.peak>.045,'Audio output meter must detect audible signal, not just updated gain variables');
              assert(loud.peak>quiet.peak*1.2,'SFX slider at 100% must produce stronger output than 25%');
              const setting=async(name,value)=>page.evaluate(({name,value})=>{
                const el=document.querySelector('#wt-feel-settings [data-pref="'+name+'"]');
                if(!el)throw Error('Control missing '+name);
                if(el.type==='checkbox')el.checked=value;else el.value=value;
                el.dispatchEvent(new Event('change',{bubbles:true}));
              },{name,value});
              await setting('music',false);
              assert((await page.evaluate(()=>window.BUWTPolish.state())).sfx===true);
              assert((await page.evaluate(()=>window.BUWTPolish.state())).music===false);
              await setting('sfx',false);
              await setting('music',true);
              assert((await page.evaluate(()=>window.BUWTPolish.state())).sfx===false);
              assert((await page.evaluate(()=>window.BUWTPolish.state())).music===true);
              await setting('sfx',true);
              await setting('sfxVolume',55);
              await setting('musicVolume',45);
              await page.click('#wt-feel-settings [data-demo="correct"]');
              await page.click('#feel-done');
              assert(!(await page.evaluate(()=>document.getElementById('wt-feel-settings').open)));
              const play=async word=>page.evaluate(w=>{
                for(const ch of w){
                  const b=[...document.querySelectorAll('.wheel-letter')].find(x=>x.textContent===ch&&!x.classList.contains('selected'));
                  if(!b)throw Error('Missing '+ch+' for '+w);
                  b.click();
                }
                document.querySelector('#submit').click();
              },word);
              await page.evaluate(()=>{
                const b=[...document.querySelectorAll('.wheel-letter')].find(x=>x.textContent==='C');
                b.click();
                b.click(); // Selecting then deselecting plays the new soft undo.
              });
              assert.equal(await page.$eval('#preview',e=>e.textContent),'','Letter undo must clear selection');
              await play('CAT');
              assert.equal(await $('#points'),'62');
              assert.equal(await $('#bonus-count'),'1');
              let coins=await page.$$eval('#wt-feel-layer .feel-coin',els=>els.length);
              console.log('COIN_PARTICLES_AFTER_BONUS',coins);
              assert(coins>0,'Reward coins must visibly fly to HUD');
              await play('ACT');
              assert.equal(await $('#points'),'64');
              await play('TAN');
              assert.equal(await $('#points'),'74','Three bonus words should pay 3×2 plus one +8 satchel');
              assert.equal(await $('#bonus-count'),'3');
              assert.equal(await page.$eval('#bonus-pips',el=>el.dataset.fill),'3');
              let saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('bu-visual-lab-wordtrails-next-v1')));
              assert(saved.paidBonuses.includes('satchel:0'));
              console.log('SATCHEL',JSON.stringify({coins:saved.coins,bonuses:saved.paidBonuses}));
              const gameplayShot=(await page.screenshot({type:'jpeg',quality:55})).toString('base64');
              for(let i=0;i<gameplayShot.length;i+=8000)
                console.log('FEEL_GAME_SHOT_'+(i/8000)+' '+gameplayShot.slice(i,i+8000));
              await page.goto('http://127.0.0.1:8876/experiments/word-trails-next-v1.html',{waitUntil:'networkidle0'});
              assert.equal(await $('#bonus-count'),'3');
              let pref=await page.evaluate(()=>window.BUWTPolish.state());
              assert(pref.music&&pref.sfx&&pref.sfxVolume===55&&pref.musicVolume===45);
              await openSettings();
              await setting('motion',false);
              await setting('haptics',false);
              await page.click('#feel-done');
              await new Promise(r=>setTimeout(r,1200));
              await page.click('#hint');
              const still=await page.evaluate(()=>({
                noMotion:document.documentElement.classList.contains('wt-feel-no-motion'),
                particles:document.querySelectorAll('#particles .particle,#wt-feel-layer .feel-coin').length,
                hint:document.querySelectorAll('.tile.hinted').length
              }));
              console.log('NO_MOTION_HINT',JSON.stringify(still));
              assert(still.noMotion&&still.particles===0&&still.hint===1);
              const noWinFx=await page.evaluate(()=>{
                const dialog=document.getElementById('finish');
                dialog.showModal();window.BUWTPolish.celebrateWin();
                const count=document.querySelector('#finish-fx').children.length;
                dialog.close();return count;
              });
              console.log('REDUCED_MOTION_WIN_EFFECTS',noWinFx);
              assert.equal(noWinFx,0,'No glitter or confetti may animate with visual effects disabled');
              await openSettings();
              await setting('motion',true);
              await setting('haptics',true);
              await page.click('#feel-done');
              await page.click('#level-map');
              await page.click('#reset-level');
              assert.equal(await $('#bonus-count'),'0');
              const before=Number(await $('#points'));
              await play('CAT');await play('ACT');await play('TAN');
              const after=Number(await $('#points'));
              console.log('REPLAY_SATCHEL',JSON.stringify({before,after}));
              assert.equal(after,before,'All bonus and satchel coins must pay only once per level');
              saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('bu-visual-lab-wordtrails-next-v1')));
              assert.equal(saved.paidBonuses.filter(x=>x==='satchel:0').length,1);
              await openSettings();
              const dialogBox=await page.$eval('#wt-feel-settings',el=>({height:el.getBoundingClientRect().height,window:innerHeight}));
              assert(dialogBox.height<=dialogBox.window);
              await page.click('#feel-done');
              for(const [width,height] of [[390,844],[412,744],[360,740],[375,667]]){
                await page.setViewport({width,height,isMobile:true,hasTouch:true,deviceScaleFactor:2});
                await new Promise(r=>setTimeout(r,120));
                const g=await page.evaluate(()=>{
                  const tile=document.querySelector('.tile').getBoundingClientRect(),
                  b=document.querySelector('#board').getBoundingClientRect(),
                  w=document.querySelector('#wheel').getBoundingClientRect();
                  return {tile:tile.width,boardBottom:b.bottom,wheelTop:w.top,wheelBottom:w.bottom,
                    overflow:document.body.scrollHeight-innerHeight,window:innerHeight};
                });
                console.log('PHONE_'+width+'x'+height,JSON.stringify(g));
                assert(g.tile>=60&&g.boardBottom<g.wheelTop&&g.wheelBottom<=g.window+1&&g.overflow<=1);
              }
              // A winning puzzle must render gold confetti and glitter in the DIALOG,
              // not behind the dimmed page. These decorations must not intercept taps.
              for(const word of ['ANTIC','TACO','TONIC','COIN'])await play(word);
              await page.waitForSelector('#finish[open]',{timeout:12000});
              const fx=await page.evaluate(()=>({
                panel:document.querySelector('#finish').open,
                layer:document.querySelector('#finish-fx')?.parentElement?.id,
                glints:document.querySelectorAll('#finish-fx .wt-win-glint').length,
                foils:document.querySelectorAll('#finish-fx .wt-win-foil').length,
                touch:getComputedStyle(document.querySelector('#finish-fx')).pointerEvents,
                winning:document.querySelector('#finish').classList.contains('wt-winning')
              }));
              console.log('PREMIUM_WIN_FX',JSON.stringify(fx));
              assert(fx.panel&&fx.layer==='finish'&&fx.winning,'Gold celebration must be in the victory dialog');
              assert(fx.glints>=27&&fx.foils>=58,'First premium glitter/confetti wave must appear');
              assert.equal(fx.touch,'none','Decorations must never block the Next Level button');
              await page.click('#next-level');
              await openSettings();
              await setting('motion',false);
              await page.click('#feel-done');
              for(const word of ['DINER','RIDE','DINE','DIRE'])await play(word);
              await page.waitForSelector('#finish[open]',{timeout:12000});
              const reduced=await page.evaluate(()=>({
                glints:document.querySelectorAll('#finish-fx .wt-win-glint').length,
                foils:document.querySelectorAll('#finish-fx .wt-win-foil').length,
                className:document.querySelector('#finish').className
              }));
              console.log('WIN_FX_OFF',JSON.stringify(reduced));
              assert(reduced.glints===0&&reduced.foils===0,'Motion disabled must suppress decorative particles');
              await page.click('#next-level');
              await openSettings();
              await setting('motion',true);
              await page.click('#feel-done');
              await page.evaluate(()=>{
                localStorage.removeItem('bu-wt-next-feel-v2');
                localStorage.setItem('bu-visual-lab-wordtrails-next-v1',JSON.stringify({sound:false}));
              });
              await page.goto('http://127.0.0.1:8876/experiments/word-trails-next-v1.html',{waitUntil:'networkidle0'});
              const migrated=await page.evaluate(()=>window.BUWTPolish.state());
              console.log('LEGACY_MUTE_MIGRATION',JSON.stringify(migrated));
              assert(migrated.music===false&&migrated.sfx===false,'Old mute must remain muted after V2 settings migration');
              assert.equal(errors.length,0,'Page errors: '+errors.join(' | '));
              console.log('PASS FEEL LAB v2: independent settings, bonus coins, repeat-safe satchel, animation toggles, Android browser geometry');
            }catch(e){console.error('FAIL',e.stack);process.exitCode=1}
            finally{if(browser)await browser.close()}
          })();
          JS