name: QA Word Trails NWT editorial levels 12–16 and legacy puzzle integrity
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-editorial-12-16-v1.yml'
      - 'scripts/qa_word_trails_editorial_levels_12_16.mjs'
      - 'experiments/word-trails-levels-12-30-v1.js'
      - 'docs/WORD_TRAILS_12_TO_30_SOURCE_LEDGER_2026-11-09.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-ledger-and-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify 21 source-checked entries and ledger parity
        run: |
          set -euo pipefail
          node --check scripts/qa_word_trails_editorial_levels_12_16.mjs
          node scripts/qa_word_trails_editorial_levels_12_16.mjs
          node scripts/qa_word_trails_scripture_batch1.mjs
      - name: Protect old crossword grids and all 30 playable levels
        run: |
          set -euo pipefail
          node scripts/word_trails_quality_gate.mjs
