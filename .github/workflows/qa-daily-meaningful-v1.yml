name: QA Meaningful Daily Discovery — TEST Only
on:
  push:
    paths:
      - 'daily-discovery-meaningful-test-v1.js'
      - 'daily-discovery-meaningful-test-v1.css'
      - 'daily-discovery-insights-content-test-v1.js'
      - 'scripts/qa_daily_meaningful_v1.cjs'
      - 'visual-lab-test-banner.js'
      - '.github/workflows/qa-daily-meaningful-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and all local assets
        run: |
          set -euo pipefail
          node --check daily-discovery-meaningful-test-v1.js
          node --check daily-discovery-insights-content-test-v1.js
          node --check scripts/qa_daily_meaningful_v1.cjs
          node --check visual-lab-test-banner.js
          test -f BIBLE_UNFOLDED_RULEBOOK_START_HERE.md
          for n in 01_the_beginning 02_faith_promises 03_deliverance 04_judges_kings 05_exile_return 06_the_messiah 07_good_news_spreads; do
            test -f "journey-art/$n.webp"
          done
          test -f family-worship-menu-art/v1/topic-12-baby-moses.webp
          test -f scholar-research-assets/witness-history.webp
          test -f 15-joseph-names-and-decisions.jpg
          grep -q 'bu-daily-insight-test-v1' daily-discovery-meaningful-test-v1.js
      - name: Run browser acceptance in portrait and landscape (native Daily and save isolation)
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-meaningful-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8891 --bind 127.0.0.1 >/tmp/bu-meaningful-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-meaningful-qa/node_modules node scripts/qa_daily_meaningful_v1.cjs
      - name: Save actual TEST browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meaningful-daily-discovery-v1-phone-screenshots
          path: /tmp/BU-MEANINGFUL-DAILY-*.png
          if-no-files-found: ignore
