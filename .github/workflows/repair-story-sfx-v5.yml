name: Repair original Story Adventure audio source (Visual Lab only)
on:
  push:
    paths:
      - '.github/workflows/repair-story-sfx-v5.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair original Stage41 source and validate full assembled game syntax
        run: |
          python3 .github/scripts/story_audio_v5.py
      - name: Commit verified Visual Lab audio fix and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/repair-story-sfx-v5.yml .github/scripts/story_audio_v5.py
          git add bible_unfolded_core_part3.js bible_unfolded_core_part5.js premium-sfx.js journey-progress-caption.js
          git diff --cached --stat
          git commit -m "Visual Lab: delete original knock sample and fix single-source Story tap/swipe V5"
          git push origin HEAD:main
