name: QA Story Adventure Nehemiah playable chapter — TEST Only
on:
  push:
    paths:
      - 'experiments/story-adventure-nehemiah-explore-v1.html'
      - 'story-adventure-explore-launcher-test-v1.js'
      - 'visual-lab-test-banner.js'
      - 'scripts/qa_story_nehemiah_real_player_v1.cjs'
      - '.github/workflows/qa-story-nehemiah-real-player-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobile-actual-playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify source assets, TEST-only isolation and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check story-adventure-explore-launcher-test-v1.js
          node --check scripts/qa_story_nehemiah_real_player_v1.cjs
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const page=fs.readFileSync('experiments/story-adventure-nehemiah-explore-v1.html','utf8');
          const js=page.match(/<script>([\s\S]*?)<\/script>/);
          assert(js,'Chapter must contain game logic');
          new (require('node:vm').Script)(js[1]);
          assert(fs.statSync('bible-book-art/16_nehemiah.webp').size>10000);
          assert(page.includes('/en/library/bible/nwt/books/nehemiah/4/'));
          assert(page.includes('/en/library/bible/nwt/books/nehemiah/6/'));
          assert(!page.includes('bible-unfolded-word-trails-next-v1'));
          const loader=fs.readFileSync('visual-lab-test-banner.js','utf8');
          assert(loader.includes('story-adventure-explore-launcher-test-v1.js'));
          console.log('PASS_CHAPTER_SOURCE_AND_LOADER');
          JS
      - name: Play all 3 episodes at two actual Chrome phone viewports
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-story-nehemiah-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/bu-story-nehemiah-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-story-nehemiah-qa/node_modules node scripts/qa_story_nehemiah_real_player_v1.cjs
