name: QA Word Trails mock checkpoint download and guarded recovery screen v2
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-checkpoint-rehearsal-v2.yml'
      - 'experiments/word-trails-checkpoint-rehearsal-v2.html'
      - 'experiments/word-trails-checkpoint-rehearsal-v2.js'
      - 'experiments/word-trails-recovery-checkpoint-candidate-v3.js'
      - 'scripts/qa_word_trails_checkpoint_rehearsal_v2_browser.cjs'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  simulated-recovery-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and enforced production isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/word-trails-checkpoint-rehearsal-v2.js
          node --check experiments/word-trails-recovery-checkpoint-candidate-v3.js
          node --check scripts/qa_word_trails_checkpoint_rehearsal_v2_browser.cjs
          node scripts/qa_word_trails_recovery_checkpoint_v3.cjs
          if grep -n -E '(^|[^.a-zA-Z])localStorage[[:space:]]*(\.|\[)' experiments/word-trails-checkpoint-rehearsal-v2.js; then
            echo 'STOP: standalone rehearsal controller must not directly read or write browser localStorage' >&2
            exit 1
          fi
          if grep -Rl -E 'word-trails-checkpoint-rehearsal-v2|word-trails-recovery-checkpoint-candidate-v3' index.html journey-progress-caption.js visual-lab-test-banner.js word-trails-native-shell-v1.js experiments/word-trails-next-v1.html; then
            echo 'STOP: rehearsal or checkpoint candidate was wired into real game' >&2
            exit 1
          fi
          echo 'PASS: all source unlinked from actual Bible Unfolded gameplay'
      - name: Start isolated browser and HTTP test server
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-wt-checkpoint-rehearsal-browser puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8896 --bind 127.0.0.1 >/tmp/bu-wt-rehearsal-v2-http.log 2>&1 &
          sleep 1
      - name: Real file download, upload, confirmation and safe recovery on two mobile viewports
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH=/tmp/bu-wt-checkpoint-rehearsal-browser/node_modules node scripts/qa_word_trails_checkpoint_rehearsal_v2_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-trails-checkpoint-rehearsal-v2-phone-preview
          path: /tmp/BU-WT-CHECKPOINT-REHEARSAL-V2-390.png
          if-no-files-found: ignore
          retention-days: 5
