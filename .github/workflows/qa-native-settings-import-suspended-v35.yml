name: QA TEST suspend native Settings import safely v35
on:
  push:
    paths:
      - '.github/workflows/qa-native-settings-import-suspended-v35.yml'
      - 'scripts/qa_native_settings_import_suspended_v35.cjs'
      - 'bu-platform-saves-v2.js'
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}
jobs:
  test-native-v1-v2-user-import-stopped:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate real TEST native Settings import interception and unchanged read-only backup features
        shell: bash
        run: |
          set -euo pipefail
          node --check bu-platform-saves-v2.js
          node --check scripts/qa_native_settings_import_suspended_v35.cjs
          node scripts/qa_native_settings_import_suspended_v35.cjs
