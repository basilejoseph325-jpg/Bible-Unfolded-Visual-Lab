name: QA TEST suspend native Settings import safely v35
on:
  push:
    paths:
      - '.github/workflows/qa-native-settings-import-suspended-v35.yml'
      - 'scripts/qa_native_settings_import_suspended_v35.cjs'
      - 'scripts/qa_native_settings_import_suspended_v35_real_browser.cjs'
      - 'bu-platform-saves-v2.js'
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}
jobs:
  test-native-v1-v2-user-import-stopped:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate real TEST native Settings import interception and unchanged read-only backup features
        shell: bash
        run: |
          set -euo pipefail
          node --check bu-platform-saves-v2.js
          node --check scripts/qa_native_settings_import_suspended_v35.cjs
          node scripts/qa_native_settings_import_suspended_v35.cjs
      - name: Install synthetic real browser driver
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa_native_settings_import_suspended_v35_real_browser.cjs
          npm install --prefix /tmp/bu-import-v35 puppeteer-core@24 --silent --no-audit --no-fund
      - name: Actual mobile Chromium native import UI guard, both backup formats and protected LIVE data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8897 --bind 127.0.0.1 >/tmp/bu-import-v35-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-import-v35/node_modules \
           node scripts/qa_native_settings_import_suspended_v35_real_browser.cjs
