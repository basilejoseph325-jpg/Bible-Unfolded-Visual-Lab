name: Inspect Native Settings and Announcers for Word Trails
on:
  push:
    paths: ['.github/workflows/inspect-word-trails-native-settings.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Find main settings UI and voice preferences
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('index.html'),*sorted(Path('.').glob('bible_unfolded_core_part*.js'))]
          patterns={'setting-title':r'(?:id=["\'](?:settings|settings-modal|settings-panel)|PERSONALIZE THE JOURNEY|Background soundtrack|Hear word-complete sound)',
                    'announcer':r'Announcer|Rotate voices|VOICE ANNOUNCEMENTS|voiceVolume|announcerMode|selectedVoice|preferredVoice',
                    'speaker':r'speechSynthesis|SpeechSynthesisUtterance|playAnnouncer|announceGood|GOOD JOB|Good job|Great job|voiceEnabled',
                    'prefs':r'(?:buSettings|BUPrefs|SETTINGS_KEY|settingsKey|bible-unfolded-settings|voiceVolume)',
                    'scene':r'(?:bible-book-art|wordTrailsNext)'}
          for f in files:
            s=f.read_text(errors='replace')
            for k,pat in patterns.items():
              hits=list(re.finditer(pat,s,re.I))
              print('FILE_COUNT',f.name,k,len(hits))
              for m in hits[:(13 if k in ('announcer','prefs','speaker') else 7)]:
                lo=max(0,m.start()-360);hi=min(len(s),m.end()+710)
                print('MATCH',f.name,k,m.start(),repr(s[lo:hi].replace('\n',' ')[:1090]))
          s=Path('bible_unfolded_core_part5.js').read_text(errors='replace')
          for label,a,b in [('VOICE_START',4152200,4157800),('VOICE_END',4157800,4163100)]:
            print(label,repr(s[a:b]))
          i=Path('index.html').read_text(errors='replace')
          print('NATIVE_SETTINGS_HTML',repr(i[1282410:1286800]))
          import json
          src=Path('bible_unfolded_core_part5.js').read_text(errors='replace')
          idxs=[m.start() for m in re.finditer('BU382_EMBEDDED_VOICES',src)]
          print('VOICE_BANK_POSITIONS',idxs)
          for p in idxs[:2]:print('VOICE_BANK_SAMPLE',repr(src[max(0,p-150):p+200]))
          for token in ['const BU382_EMBEDDED_VOICES=','const BU382_EMBEDDED_VOICES =','BU382_EMBEDDED_VOICES =','bu381Play(']:
            idx=src.find(token);print('VOICE_DEFINITION',token,idx)
            if token.startswith('const BU382') and idx>=0:
              print('VOICE_BANK_END',src.find('};',idx), 'BYTES',src.find('};',idx)-idx)
          html=Path('index.html').read_text(errors='replace')
          for token in ['const STORAGE_KEY','const SAVE_KEY','const musicOn','localStorage.setItem(','id="settings-dialog"']:
            hits=[m.start() for m in re.finditer(re.escape(token),html)];print('PREF_LOCATIONS',token,hits[:8])
          for token in ['function bu25VolumeEnvelope','setting-music','setting-sfx','setting-volume','bu381-voice-mode']:
            matches=[m.start() for m in re.finditer(re.escape(token),src)]
            print('NATIVE_PREF_CODE',token,matches[:8])
          PY