name: Install premium Trivia Together test UI
on:
  push:
    paths:
      - .github/workflows/install-premium-trivia-together.yml
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Visual Lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate scripts and untouched source
        shell: bash
        run: |
          set -euo pipefail
          node --check trivia-together-premium.js
          test -s trivia-together-premium.css
          test -f scholar-research-assets/heroes-of-courage.webp
          test -f scholar-research-assets/ultimate-challenge.webp
          test -f scholar-research-assets/hidden-bible-details.webp
          actual="$(git hash-object index.html)"
          expected="8a955afba2e9cf56af769f161b42aa89ffaac3ad"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Original test index changed; refusing to overwrite."
            exit 1
          fi
      - name: Link premium UI without changing original game logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          old=p.read_bytes()
          assert old.count(b"</head>")==1
          assert old.count(b"</body>")==1
          assert b'bible_unfolded_core_part5.js' in old
          assert b'trivia-together-premium.js' not in old
          assert b'trivia-together-premium.css' not in old
          new=old.replace(b"</head>",b'<link rel="stylesheet" href="trivia-together-premium.css?v=1">\n</head>')
          new=new.replace(b"</body>",b'<script src="trivia-together-premium.js?v=1"></script>\n</body>')
          assert new.count(b'trivia-together-premium.js')==1
          assert new.count(b'trivia-together-premium.css')==1
          assert len(new)-len(old)<200
          p.write_bytes(new)
          PY
          git diff --check
      - name: Commit test installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable illustrated custom Trivia Together selectors in Visual Lab"
          git push
