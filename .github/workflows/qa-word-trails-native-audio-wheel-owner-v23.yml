name: QA Word Trails native Settings, audio, announcer and Ocean Glow parity v23
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-native-audio-wheel-owner-v23.yml'
      - 'scripts/qa_word_trails_native_audio_wheel_owner_v23.cjs'
      - 'experiments/word-trails-feel-v2.js'
      - 'experiments/word-trails-native-wheel-v1.js'
      - 'experiments/word-trails-main-settings-v1.js'
      - 'word-trails-native-shell-v1.js'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-single-audio-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks and no-LIVE-migration-source in TEST
        shell: bash
        run: |
          set -euo pipefail
          for f in experiments/word-trails-feel-v2.js word-trails-native-shell-v1.js experiments/word-trails-announcer-v1.js experiments/word-trails-native-wheel-v1.js scripts/qa_word_trails_native_audio_wheel_owner_v23.cjs; do node --check "$f"; done
          grep -F 'persist:false' word-trails-native-shell-v1.js
          grep -F 'return native.openSettings()' experiments/word-trails-feel-v2.js
          grep -F 'native&&persist' experiments/word-trails-feel-v2.js
      - name: Install browser and start isolated TEST server
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wordtrails-native-parity puppeteer-core@24 --silent --no-audit --no-fund
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/wt-native-parity-http.log 2>&1 &
          sleep 1
      - name: Test real native homepage and effects at two phone sizes
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH=/tmp/wordtrails-native-parity/node_modules node scripts/qa_word_trails_native_audio_wheel_owner_v23.cjs
