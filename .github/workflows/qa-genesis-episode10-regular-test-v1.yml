name: QA Genesis Episode 10 inside regular TEST Story Adventure
on:
  push:
    branches: [main]
    paths:
      - 'scripts/qa_genesis_ep10_regular_test_v1.cjs'
      - '.github/workflows/qa-genesis-episode10-regular-test-v1.yml'
      - 'bible_unfolded_core_part3.js'
      - 'bible_unfolded_core_part5.js'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  story-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Check both original and added native code
        run: |
          set -euo pipefail
          node --check scripts/qa_genesis_ep10_regular_test_v1.cjs
          for p in bible_unfolded_core_part*.js; do node --check "$p"; done
          test ! -e experiments/story-adventure-nehemiah-explore-v1.html
          test ! -e story-adventure-explore-launcher-test-v1.js
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          pieces=[]
          for i in range(1,6):
            raw=Path(f'bible_unfolded_core_part{i}.js').read_text()
            m=re.search(r'__BU_STAGE41_CORE_PARTS__\[\d+\] = (".*");',raw,re.S)
            assert m, f'Original native Story part {i} missing'
            pieces.append(json.loads(m.group(1)))
          src=''.join(pieces)
          assert "const BU_GENESIS_IDS=['genesis_ep07','genesis_ep08','genesis_ep09','genesis_ep10'];" in src
          assert "Genesis Episodes 7–10" in src
          assert 'bible-unfolded-genesis-adventure-v3860' in src
          print('PASS: original serialized native Story engine extends to Episode 10')
          PY
      - name: Run real mobile Chrome Story Adventure play-path regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-ep10-prodtest puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8893 --bind 127.0.0.1 >/tmp/bu-ep10-regression.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-ep10-prodtest/node_modules node scripts/qa_genesis_ep10_regular_test_v1.cjs
