name: QA TEST external old-page save activity guard v32
on:
  push:
    paths:
      - '.github/workflows/qa-native-external-page-guard-v32.yml'
      - 'scripts/qa_native_external_page_storage_guard_v32.cjs'
      - 'scripts/qa_native_external_page_storage_guard_v32_real_browser.cjs'
      - 'bu-platform-saves-v2.js'
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}
jobs:
  detect-competing-page-and-block-unsafe-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate native source and run synthetic external-page storage event guard tests
        shell: bash
        run: |
          set -euo pipefail
          node --check bu-platform-saves-v2.js
          node --check scripts/qa_native_external_page_storage_guard_v32.cjs
          node scripts/qa_native_external_page_storage_guard_v32.cjs
      - name: Install real Chromium multi-document driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-external-v32 puppeteer-core@24 --silent --no-audit --no-fund
      - name: Two fresh native pages on the same browser origin — detect old LIVE migration writes
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa_native_external_page_storage_guard_v32_real_browser.cjs
          python3 -m http.server 8897 --bind 127.0.0.1 >/tmp/bu-external-v32-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-external-v32/node_modules node scripts/qa_native_external_page_storage_guard_v32_real_browser.cjs
