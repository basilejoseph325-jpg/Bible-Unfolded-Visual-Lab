name: QA Word Trails actual WebKit touch-word, drag, hints, Scripture, resume v10
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-webkit-play-v10.yml'
      - 'scripts/qa_word_trails_webkit_actual_play_v10.cjs'
      - 'experiments/word-trails-next-v1.js'
      - 'experiments/word-trails-next-v1.html'
      - 'word-trails-native-shell-v1.js'
      - 'word-trails-next-launcher.js'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-webkit-letters-and-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Validate new integration script
        run: node --check scripts/qa_word_trails_webkit_actual_play_v10.cjs
      - name: Install isolated WebKit browser engine
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wt-webkit-play-v10 playwright@latest --silent --no-audit --no-fund
          /tmp/wt-webkit-play-v10/node_modules/.bin/playwright install --with-deps webkit
      - name: Play actual Word Trails in native TEST with real WebKit browser input
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8896 --bind 127.0.0.1 >/tmp/bu-wt-webkit-play-v10-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/wt-webkit-play-v10/node_modules node scripts/qa_word_trails_webkit_actual_play_v10.cjs
          echo 'PASS: automated WebKit taps/drag are not physical Safari gesture/audio certification'
