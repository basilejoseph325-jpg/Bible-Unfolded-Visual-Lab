name: QA TEST Word Trails native Chromium finger touch input v11
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-real-touch-v11.yml'
      - 'scripts/qa_word_trails_real_touch_chromium_v11.cjs'
      - 'experiments/word-trails-next-v1.js'
      - 'experiments/word-trails-next-v1.html'
      - 'word-trails-native-shell-v1.js'
      - 'experiments/word-trails-next-v1.css'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  real-touch-native-iframe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify QA code
        run: node --check scripts/qa_word_trails_real_touch_chromium_v11.cjs
      - name: Install isolated Chromium browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-wt-real-touch-v11 playwright@latest --silent --no-audit --no-fund
          /tmp/bu-wt-real-touch-v11/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify full real game uses touch start/move/end rather than mouse
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8896 --bind 127.0.0.1 >/tmp/bu-wt-touch-v11-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-wt-real-touch-v11/node_modules node scripts/qa_word_trails_real_touch_chromium_v11.cjs
          echo 'PASS means Chromium synthetic touch events worked; physical Android/iPhone hardware still unverified'
