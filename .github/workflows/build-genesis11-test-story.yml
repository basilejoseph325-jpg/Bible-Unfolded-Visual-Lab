name: Build TEST Genesis Episode 11 original Story Adventure, artwork and QA
on:
  push:
    branches: [feature/genesis11-family-haran-20261114]
    paths:
      - '.github/workflows/build-genesis11-test-story.yml'
      - 'scripts/install_genesis11_native_story_test_v1.py'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install only the original native Genesis Story chapter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/install_genesis11_native_story_test_v1.py
          node --check scripts/qa_genesis11_complete_native_playpath_v1.cjs
          node --check scripts/qa_genesis11_three_thinking_hints_v1.cjs
          python3 scripts/install_genesis11_native_story_test_v1.py
          for p in bible_unfolded_core_part{1..5}.js; do node --check "$p"; done
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          joined=[]
          for i in range(1,6):
            s=Path(f"bible_unfolded_core_part{i}.js").read_text()
            m=re.search(r'__BU_STAGE41_CORE_PARTS__\[\d+\] = (".*");',s,re.S)
            assert m
            joined.append(json.loads(m.group(1)))
          src=''.join(joined)
          Path('/tmp/Genesis11_all_native.js').write_text(src)
          subprocess.run(['node','--check','/tmp/Genesis11_all_native.js'],check=True)
          for id in (f"g11-d{i:02d}" for i in range(1,11)):
            assert id in src
          assert "const BU_GENESIS_IDS=['genesis_ep07','genesis_ep08','genesis_ep09','genesis_ep10','genesis_ep11']" in src
          assert src.count('Object.assign(BU_HQ_WORDS,{"g11-d01"')==1
          assert 'bible-unfolded-genesis-adventure-v3860' in src
          assert 'BU_EP11_SCENE_ART=Object.freeze(' in src
          print('PASS_GENESIS11_NATIVE_SOURCES_CORRECT')
          PY
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'index.html','bible_unfolded_core_part3.js','bible_unfolded_core_part5.js'}
          assert actual==expected, f'Unexpected modified source files: {actual^expected}'
          print('PASS ONLY 3 GAME FILES MODIFIED; all previous Story modes and save scripts intact')
          PY
      - name: Actual word wheels and photo rendering in two mobile Chrome sizes
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/genesis11-test-browser puppeteer-core@24 --silent --no-audit --no-fund
          python3 -m http.server 8893 --bind 127.0.0.1 >/tmp/genesis11-test-server.log 2>&1 &
          sleep 2
          export NODE_PATH=/tmp/genesis11-test-browser/node_modules
          node scripts/qa_genesis11_complete_native_playpath_v1.cjs
          node scripts/qa_genesis11_three_thinking_hints_v1.cjs
          echo 'PASS all ten original Story wheels, ten original photos, hints, completion and saved progress'
      - name: Preserve result on candidate branch ONLY after QA passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html bible_unfolded_core_part3.js bible_unfolded_core_part5.js
          git diff --cached --quiet && { echo 'No expected Story source edits' >&2; exit 1; }
          git commit -m 'feat(TEST candidate): fully playable Genesis Episode 11 with all ten illustrations'
          git push origin HEAD:feature/genesis11-family-haran-20261114
          echo 'PASS Candidate committed; LIVE and normal TEST remain untouched until promotion'
