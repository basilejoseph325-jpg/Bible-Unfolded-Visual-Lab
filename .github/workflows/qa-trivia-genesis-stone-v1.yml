name: QA Trivia Genesis Clarity and Four Stone Tablets — TEST
on:
  push:
    paths:
      - 'scripts/qa_trivia_genesis_stone_v1.cjs'
      - 'trivia-genesis-food-clarity-test-v1.js'
      - 'trivia-photo-stone-tablets-v4.css'
      - 'journey-progress-caption.js'
      - '.github/workflows/qa-trivia-genesis-stone-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Genesis question patch and stable stone asset
        run: |
          set -euo pipefail
          node --check trivia-genesis-food-clarity-test-v1.js
          node --check scripts/qa_trivia_genesis_stone_v1.cjs
          node --check journey-progress-caption.js
          test -s assets/ui/trivia-real-rock-v4.jpg
          grep -q 'trivia-genesis-food-clarity-test-v1.js' journey-progress-caption.js
      - name: Verify native Trivia question, photo, grading and layout in mobile browser
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-trivia-genesis-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/bu-trivia-genesis-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-trivia-genesis-qa/node_modules node scripts/qa_trivia_genesis_stone_v1.cjs
      - name: Store portrait/landscape screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivia-genesis-four-tablet-phone-screens
          path: /tmp/BU-TRIVIA-GENESIS-STONE-*.png
          if-no-files-found: ignore
