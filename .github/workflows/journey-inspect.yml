name: Story Journey Read-Only Inspection
on:
  push:
    paths: ['.github/workflows/journey-inspect.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect specific runtime selectors and styles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          pats=['route-stop','journey-stops','episodes-cover','episode-card','chapter-guide-cover','chapter-guide','trail-svg','stage','journey-progress-label']
          for term in pats:
            matches=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
            print('TERM',term,'MATCHES',len(matches),'POSITIONS',matches[:45])
            for pos in matches:
              if pos<1250000 or pos>11500000:continue
              print('RUNTIME',term,'POS',pos,s[max(0,pos-550):pos+1000].replace('\n','\\n'))
          PY
