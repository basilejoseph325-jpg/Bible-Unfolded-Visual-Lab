name: Story Journey Read-Only Inspection
on:
  push:
    paths:
      - '.github/workflows/journey-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Journey runtime markup and selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['journey-stops','journey-stop','route-stop','stop-card','journey-node','journey-intro','episodes-cover','episode-list','chapter-guide-cover','story-open','route-world','journey-progress-fill','route-to-levels']
          for term in terms:
              hits=list(re.finditer(re.escape(term),s,re.I))
              print('TERM',term,'COUNT',len(hits))
              for m in hits[:6]:
                  c=s[max(0,m.start()-450):min(len(s),m.end()+1000)]
                  if 'base64' in c:
                      c=c[:400]
                  print('POS',m.start(),'CONTEXT',c.replace('\n','\\n'))
          PY
