name: Balance Daily Discovery answer loudness in Visual Lab
on:
  push:
    paths: ['.github/workflows/boost-daily-answer-audio-20261104.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/boost_daily_answer_audio_20261104.py
      - run: |
          git add bible_unfolded_core_part5.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Visual Lab: boost Daily Discovery correct and wrong answer loudness"
          git push origin HEAD:main
