name: Genesis 12 native gameplay candidate (no deployment)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'story-adventure-episode12-integration-test.js'
      - 'story-adventure-content/genesis-episode12-return-to-esau-v1.json'
      - 'scripts/qa_genesis12_native.cjs'
      - 'journey-progress-caption.js'
      - '.github/workflows/qa-genesis12-native.yml'
permissions:
  contents: read
jobs:
  genesis12-mobile-browser:
    if: github.repository == 'basilejoseph325-jpg/Bible-Unfolded-Visual-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix work --no-audit --no-fund puppeteer-core@25.17.0
      - name: Start local candidate web app
        run: |
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          python3 -m http.server 8893 --bind 127.0.0.1 > work/http-genesis12.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8893/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: All 13 native Genesis 12 word wheels and safety checks at two mobile sizes
        env:
          NODE_PATH: '${{ github.workspace }}/work/node_modules'
        run: node scripts/qa_genesis12_native.cjs
