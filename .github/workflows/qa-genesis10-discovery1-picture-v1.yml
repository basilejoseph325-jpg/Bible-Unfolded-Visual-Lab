name: QA Genesis10 Story photos 1 3 4 in Chrome, unchanged locks
on:
  push:
    branches: [fix/genesis10-first-photo-20261114]
    paths:
      - '.github/workflows/qa-genesis10-discovery1-picture-v1.yml'
      - 'scripts/install_genesis10_discovery1_photo_test.py'
      - 'scripts/qa_genesis10_first_picture_20261114.cjs'
permissions: {contents: write}
jobs:
  add-first-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Append FIRST photo to original native Story scene map only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/install_genesis10_discovery1_photo_test.py
          node --check scripts/qa_genesis10_first_picture_20261114.cjs
          python3 - <<'PY'
          from pathlib import Path
          import json,re,subprocess
          parts=[]
          for i in range(1,6):
            content=Path(f'bible_unfolded_core_part{i}.js').read_text()
            m=re.search(r'__BU_STAGE41_CORE_PARTS__\[\d+\] = (".*");',content,re.S)
            assert m
            parts.append(json.loads(m.group(1)))
          alljs=''.join(parts)
          assert alljs.count("story-adventure-art/genesis10/abraham-burial-promise.webp")==1
          assert "function bu3857Render(){" in alljs
          Path('/tmp/story10-native.js').write_text(alljs)
          subprocess.run(['node','--check','/tmp/story10-native.js'],check=True)
          changes=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert len(changes)==1 and changes[0].startswith('bible_unfolded_core_part'),changes
          print('PASS_SCOPE: Only native chapter 10 art mapping changed, no lock/saves')
          PY
      - name: Load actual pictures and word wheels in mobile Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-story-d1-picture-pup puppeteer-core@24 --silent --no-audit --no-fund
          python3 -m http.server 8895 --bind 127.0.0.1 >/tmp/bu-photo-d1-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-story-d1-picture-pup/node_modules node scripts/qa_genesis10_first_picture_20261114.cjs
      - name: Publish passing Story photo to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bible_unfolded_core_part*.js
          git diff --cached --quiet && { echo 'Expected photo map edit missing'; exit 1; }
          git commit -m 'fix(TEST candidate): restore photo to Genesis10 first discovery'
          git push origin HEAD:fix/genesis10-first-photo-20261114
