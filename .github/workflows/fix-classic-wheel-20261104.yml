name: Apply and test free Classic wheel (Visual Lab)
on:
  push:
    paths: ['.github/workflows/fix-classic-wheel-20261104.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded wheel patch and Node regression test
        run: python3 .github/scripts/enable_classic_wheel.py
      - name: Commit tested core change
        run: |
          git add bible_unfolded_core_part5.js
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Visual Lab: restore free Classic wheel and preserve selected finish"
          git push origin HEAD:main
