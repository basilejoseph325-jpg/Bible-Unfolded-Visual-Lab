name: QA Word Trails NWT editorial levels 17–21 and crossword quality
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-editorial-17-21-v1.yml'
      - 'scripts/qa_word_trails_editorial_levels_17_21.mjs'
      - 'experiments/word-trails-levels-12-30-v1.js'
      - 'docs/WORD_TRAILS_12_TO_30_SOURCE_LEDGER_2026-11-09.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-editorial-and-game:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check all 20 revised/retained source records and crosswords
        run: |
          set -euo pipefail
          node --check scripts/qa_word_trails_editorial_levels_17_21.mjs
          node scripts/qa_word_trails_editorial_levels_17_21.mjs
          node scripts/qa_word_trails_editorial_levels_12_16.mjs
          node scripts/qa_word_trails_scripture_batch1.mjs
          node scripts/word_trails_quality_gate.mjs
