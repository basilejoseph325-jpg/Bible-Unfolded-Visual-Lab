name: Install Bible Word Challenges Visual Lab enhancement
on:
  push:
    paths:
      - '.github/workflows/install-bible-word-challenges.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add isolated enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="bible-word-challenges-visual.js?v=1"></script>'
          if 'bible-word-challenges-visual.js' not in s:
              if '</body>' not in s: raise SystemExit('No closing body tag')
              p.write_text(s.replace('</body>',tag+'\n</body>',1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load Bible Word Challenges Visual Lab enhancement"
            git push
          fi
