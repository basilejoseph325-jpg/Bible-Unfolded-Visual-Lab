name: QA published TEST Genesis 10 scene photos 1 3 and 4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-public-genesis10-real-pictures-20261114.yml']
permissions: {contents: read}
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Check photo regression test
        run: node --check scripts/qa_genesis10_first_picture_20261114.cjs
      - name: Check published TEST images with synthetic phone browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-public-story-photo puppeteer-core@24 --silent --no-audit --no-fund
          STORY_URL='https://basilejoseph325-jpg.github.io/Bible-Unfolded-Visual-Lab/?photo_fix=nov14-d01' NODE_PATH=/tmp/bu-public-story-photo/node_modules node scripts/qa_genesis10_first_picture_20261114.cjs
