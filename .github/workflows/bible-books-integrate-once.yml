name: Activate Illustrated Bible Books in Visual Lab Once
on:
  push:
    paths:
      - '.github/workflows/bible-books-integrate-once.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Strictly guarded Bible Books stylesheet activation
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking untouched Visual Lab gameplay source and all 11 image blobs"
          test "$(git hash-object index.html)" = "cc1afd57760a16fdf2a841489798068c22decdee"
          test "$(git hash-object bible-books-cinematic.css)" = "e14045ce0d511eab8d26b4ae5f8085205bd2ebd5"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected={
            "01_genesis": "6b386ba0014b8327fd5677a8b55ba96d93290545",
            "02_exodus": "f07f6b99754fee2ec1cae14378b53c44bae3e5f0",
            "03_leviticus": "b398cb70c0d03c66e099fba503df69b0fc012070",
            "04_numbers": "61a9ff939e47fe8df0c09ecb094b0946d427ee5b",
            "05_deuteronomy": "32e1d17b2342fc2c5b1a63ed7e84cf56df4327dd",
            "06_joshua": "d80c8be9ba5b956712e2715c02e557b60be8fddc",
            "07_judges": "8dab4a8dff2e001af91ea75413553c58dba1a6c8",
            "08_ruth": "a096b5e85c5bb22c3ae6420a18dd94b1116103d4",
            "09_1_samuel": "a2fbcf8eab2bb65944bcd581a303f4b31065eddd",
            "10_2_samuel": "614124b0114ebe4d76c0ff4d35bef4d894ba81ed",
            "11_1_kings": "1436c53556968fb0a8a53b6d9d291b0c67d04367",
          }
          for name,sha in expected.items():
            p=Path("bible-book-art")/(name+".webp")
            b=p.read_bytes()
            assert len(b)>60000 and b[:4]==b"RIFF" and b[8:12]==b"WEBP",name
            got=subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
            assert got==sha,(name,got)
          css=Path("bible-books-cinematic.css").read_text()
          for name in expected:
            assert name+".webp" in css,name
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          assert len(s)>10000000
          assert s.count("</head>")==1 and s.count("</body>")==1
          for marker in ('id="levels"','id="hebrew-books"','id="greek-books"','class="book-intro"'):
            assert marker in s,marker
          assert 'journey-cinematic.css' in s and 'trivia-together-premium.css' in s
          link='<link rel="stylesheet" href="bible-books-cinematic.css">'
          assert link not in s
          updated=s.replace("</head>",'  '+link+"\n</head>",1)
          assert updated.replace('  '+link+"\n","")==s,"Unexpected source mutation"
          p.write_text(updated,encoding="utf-8")
          assert updated.count(link)==1
          print("SUCCESS: 11 distinct WEBP images verified; added one stylesheet import to test game only")
          PY
          git diff --check
          git config user.name "bible-unfolded-visual-lab"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Visual Lab: enable 11 full-scene Bible Books cards in existing game"
          git push origin HEAD:main
