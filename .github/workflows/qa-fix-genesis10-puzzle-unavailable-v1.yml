name: Fix and QA Genesis Episode 10 real word wheel (TEST candidate only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-fix-genesis10-puzzle-unavailable-v1.yml']
permissions: {contents: write}
jobs:
  fix-native-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/genesis-ep10-word-wheel-20261114
          persist-credentials: true
      - name: Apply scoped fix to candidate native engine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/fix_genesis_episode10_missing_wordwheel.py
          node --check scripts/qa_genesis10_real_word_wheel_20261114.cjs
          python3 scripts/fix_genesis_episode10_missing_wordwheel.py
          for p in bible_unfolded_core_part*.js; do node --check "$p"; done
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          pieces=[]
          for i in range(1,6):
            raw=Path(f'bible_unfolded_core_part{i}.js').read_text()
            match=re.search(r'__BU_STAGE41_CORE_PARTS__\[\d+\] = (".*");',raw,re.S)
            assert match
            pieces.append(json.loads(match.group(1)))
          full=''.join(pieces)
          p=Path('/tmp/bu-genesis10-whole-native.js')
          p.write_text(full)
          subprocess.run(['node','--check',str(p)],check=True)
          assert full.count('Object.assign(BU_HQ_WORDS,{"g10-d01"')==1
          assert 'function buHQWordBoard()' in full
          for i in range(1,11):
            assert f'"g10-d{i:02d}":{{"clue"' in full
          assert "const BU_GENESIS_IDS=['genesis_ep07','genesis_ep08','genesis_ep09','genesis_ep10']" in full
          print('PASS_REAL_GENESIS10_ALL_WORD_DATA_INSTALLED')
          PY
          python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert len(names)==1 and names[0].startswith('bible_unfolded_core_part'),names
          print('PASS only one existing native serialized Story source part modified:',names[0])
          PY
      - name: Play all ten real wheel answers in two Chrome phone viewports
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-genesis10-actual-wheel-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8893 --bind 127.0.0.1 >/tmp/bu-genesis10-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-genesis10-actual-wheel-qa/node_modules node scripts/qa_genesis10_real_word_wheel_20261114.cjs
      - name: Commit only verified native Story data into TEST candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bible_unfolded_core_part*.js
          git diff --cached --quiet && { echo 'NO CHANGES: expected native Story wheel fix' >&2; exit 1; }
          git commit -m 'fix(TEST candidate): restore 10 playable Genesis Episode 10 word wheels'
          git push origin HEAD:fix/genesis-ep10-word-wheel-20261114
