name: Inspect Journey progress caption in Visual Lab
on:
  push:
    paths:
      - '.github/workflows/inspect-journey-caption.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record source matches without modifying game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          patterns=['playable episodes','adventures:','journey-intro','episodes complete']
          out=[]
          for pat in patterns:
              out.append('PATTERN '+pat)
              for m in list(re.finditer(re.escape(pat),s,re.I))[:12]:
                  out.append('OFFSET '+str(m.start())+' '+s[max(0,m.start()-350):m.end()+350].replace('\\n',' '))
          Path('journey-caption-inspection.txt').write_text('\\n'.join(out),encoding='utf-8')
          PY
      - name: Commit inspection report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journey-caption-inspection.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Journey caption source inspection (no game edits)"
            git push
          fi
