name: QA TEST verified current backup and read-only restore preview v34
on:
  push:
    paths:
      - '.github/workflows/qa-native-verified-backup-preview-v34.yml'
      - 'scripts/qa_native_verified_backup_restore_preview_v34.cjs'
      - 'scripts/qa_native_verified_backup_restore_preview_v34_real_browser.cjs'
      - 'bu-platform-saves-v2.js'
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}
jobs:
  native-current-file-proof-and-read-only-restore-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate TEST native Settings source and exact wallet/wheel/TEST restore preview
        shell: bash
        run: |
          set -euo pipefail
          node --check bu-platform-saves-v2.js
          node --check scripts/qa_native_verified_backup_restore_preview_v34.cjs
          node scripts/qa_native_verified_backup_restore_preview_v34.cjs
      - name: Install mobile Chromium test browser
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/qa_native_verified_backup_restore_preview_v34_real_browser.cjs
          npm install --prefix /tmp/bu-preview-v34 puppeteer-core@24 --silent --no-audit --no-fund
      - name: Original native Settings file inputs, TEST wallet/Word Trails preview and foreign-tab invalidation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8897 --bind 127.0.0.1 >/tmp/bu-preview-v34-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-preview-v34/node_modules \
            node scripts/qa_native_verified_backup_restore_preview_v34_real_browser.cjs
