name: QA Word Trails editorial levels 22–26 NWT and original 30-level game
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-editorial-22-26-v1.yml'
      - 'scripts/qa_word_trails_editorial_levels_22_26.mjs'
      - 'experiments/word-trails-levels-12-30-v1.js'
      - 'docs/WORD_TRAILS_12_TO_30_SOURCE_LEDGER_2026-11-09.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate-bible-puzzle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify all 61 reviewed Bible items and crossword data identity
        run: |
          set -euo pipefail
          node --check experiments/word-trails-levels-12-30-v1.js
          node --check scripts/qa_word_trails_editorial_levels_22_26.mjs
          node scripts/qa_word_trails_editorial_levels_22_26.mjs
          node scripts/qa_word_trails_editorial_levels_17_21.mjs
          node scripts/qa_word_trails_editorial_levels_12_16.mjs
          node scripts/qa_word_trails_scripture_batch1.mjs
          node scripts/word_trails_quality_gate.mjs

      - name: Verify published TEST includes corrected Job 39, Exodus 28 and two distinct repeat-answer Bible discoveries
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://basilejoseph325-jpg.github.io/Bible-Unfolded-Visual-Lab/experiments'
          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --max-time 35 -H 'Cache-Control: no-cache' "$BASE/word-trails-next-v1.html?editorial-check-v23=$attempt" |
               grep -F 'word-trails-levels-12-30-v1.js?v=word-trails-all30-variety-20261113-v26' >/dev/null &&
               curl -fsSL --retry 2 --max-time 35 -H 'Cache-Control: no-cache' "$BASE/word-trails-levels-12-30-v1.js?v=word-trails-all30-variety-20261113-v26&check=$attempt" |
               grep -F 'Which bird does Jehovah describe nesting high on a cliff when speaking to Job?' >/dev/null &&
               curl -fsSL --retry 2 --max-time 35 -H 'Cache-Control: no-cache' "$BASE/word-trails-levels-12-30-v1.js?v=word-trails-all30-variety-20261113-v26&hem=$attempt" |
               grep -F "Exodus says gold bells and colorful pomegranates went around what part of Aaron's sleeveless coat?" >/dev/null &&
               curl -fsSL --retry 2 --max-time 35 -H 'Cache-Control: no-cache' "$BASE/word-trails-levels-12-30-v1.js?v=word-trails-all30-variety-20261113-v26&ham=$attempt" |
               grep -F "Which son of Noah was the father of Cush, Mizraim, Put, and Canaan?" >/dev/null &&
               curl -fsSL --retry 2 --max-time 35 -H 'Cache-Control: no-cache' "$BASE/word-trails-levels-12-30-v1.js?v=word-trails-all30-variety-20261113-v26&dan=$attempt" |
               grep -F "Which tribe captured Leshem and named the city after its forefather?" >/dev/null; then
              echo 'PASS: actual public TEST has EAGLE, HEM, distinct HAM and DAN in versioned source; LIVE untouched'
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo 'FAIL: public TEST has not served corrected eagle clue and new script URL' >&2
              exit 1
            fi
            sleep 5
          done
