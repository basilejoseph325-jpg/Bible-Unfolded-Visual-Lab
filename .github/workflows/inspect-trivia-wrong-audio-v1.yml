name: Inspect original Bible Trivia wrong/correct sound dispatch (read only)
on:
  push:
    paths:
      - '.github/workflows/inspect-trivia-wrong-audio-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Analyze global audio init, Trivia Stage13 wrapper and test/live equivalence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('bible_unfolded_core_part5.js').read_text()
          idx=Path('index.html').read_text()
          print('CORE LENGTH',len(s),'INDEX LENGTH',len(idx),flush=True)
          for label,source in [('core',s),('index',idx)]:
            pats=[
             r'\b(?:let|var|const)\s+context\b',
             r'function\s+audioContext\s*\(',
             r'function\s+startAudio\s*\(',
             r'\baudioContext\s*=\s*function',
             r'function\s+bu3846WrongTone',
             r'function\s+bu34Choose',
             r'function\s+playChime',
             r'setTriviaChoose\s*\(',
             r'getTriviaChoose\s*\(',
             r'ctx\.wrongTone',
             r'wrongTone\s*\(',
             r'oldTriviaChoose',
             r'function\s+install\s*\(',
             r'BUTriviaLifecycleFacade',
            ]
            print('FILE',label,flush=True)
            for pat in pats:
              matches=list(re.finditer(pat,source))
              print('PAT',pat,'HITS',len(matches),flush=True)
              for m in matches[:3]:
                lo=max(0,m.start()-280);hi=min(len(source),m.start()+3500)
                chunk=source[lo:hi]
                chunk=re.sub(r'base64,[A-Za-z0-9+/=]{100,}','base64,[omitted]',chunk)
                print('CONTEXT',m.start(),repr(chunk)[:3850],flush=True)
          PY
