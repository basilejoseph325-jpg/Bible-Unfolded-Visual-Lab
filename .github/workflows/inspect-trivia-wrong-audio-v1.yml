name: Inspect original Bible Trivia wrong/correct sound dispatch (read only)
on:
  push:
    paths:
      - '.github/workflows/inspect-trivia-wrong-audio-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Trace exact v3.8.49 wrong tone, all callers, audio context and wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('index.html'),Path('bible_unfolded_core_part5.js'),Path('premium-sfx.js'),Path('trivia-stone-press-v1.js')]
          patterns=['function bu3846WrongTone','bu3846WrongTone(', 'function bu34Choose(', 'bu34Choose=function', 'bu34Choose = function', 'function bu34Next(', 'window.BUQuestionFeedbackOverlay=', 'BUQuestionFeedbackOverlay=','let context=', 'var context=', 'const context=', 'function getAudioContext', 'function playCorrect','function successSound']
          for p in files:
            if not p.exists():continue
            s=p.read_text(encoding='utf8',errors='replace')
            print('FILE',p,len(s),flush=True)
            for pat in patterns:
              hits=[m.start() for m in re.finditer(re.escape(pat),s)]
              if not hits:continue
              print('PATTERN',repr(pat),'MATCHES',len(hits),flush=True)
              for at in hits[:4]:
                start=max(0,at-450);end=min(len(s),at+5100)
                excerpt=s[start:end]
                excerpt=re.sub(r'base64,[A-Za-z0-9+/=]{120,}','base64,[omitted]',excerpt)
                print('AT',at,'TEXT',repr(excerpt)[:6000],flush=True)
          print('END FILE',p,flush=True)
          PY
