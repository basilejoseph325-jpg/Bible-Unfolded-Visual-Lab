name: TEST patch actual Levels menu to Bible Books v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-bible-books-levels-route-v5.yml'
      - '.github/scripts/patch_books_levels_menu_test_20261114.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-native-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate patch syntax
        run: python3 -m py_compile .github/scripts/patch_books_levels_menu_test_20261114.py
      - name: Patch original TEST HTML head without touching LIVE
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 .github/scripts/patch_books_levels_menu_test_20261114.py
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          raw=Path('index.html').read_text(encoding='utf-8')
          marker='<script id="bu-books-direct-entry-v5">'
          assert raw.count(marker)==1
          assert raw.index(marker)<raw.index('<style>')
          source=raw.split(marker,1)[1].split('</script>',1)[0]
          assert 'Browse Bible books' in source
          subprocess.run(['node','--check','-'],input=source,text=True,check=True)
          print('PASS: native menu Levels route is early and valid')
          PY
            git add index.html
            if git diff --cached --quiet; then
              echo 'Already installed in TEST'
              exit 0
            fi
            git commit -m 'fix(TEST): Levels menu goes to standalone Bible Books'
            if git push origin HEAD:main; then
              echo 'PASS: Chrome Levels click fix published to TEST branch'
              exit 0
            fi
            sleep 3
          done
          echo 'Concurrent updates blocked safe push' >&2
          exit 1
