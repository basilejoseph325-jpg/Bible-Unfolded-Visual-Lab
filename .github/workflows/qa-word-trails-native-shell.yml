name: QA Word Trails Native Shared Menu Host
on:
  push:
    paths:
      - '.github/workflows/qa-word-trails-native-shell.yml'
      - 'scripts/word_trails_native_shell_integration_test.cjs'
      - 'scripts/qa_word_trails_public_native_route_v36.cjs'
      - 'experiments/word-trails-next-v1.html'
      - 'word-trails-native-shell-v1.js'
      - 'word-trails-next-launcher.js'
      - 'experiments/word-trails-unified-menu-v1.js'
      - 'experiments/word-trails-announcer-v1.js'
      - 'experiments/word-trails-main-settings-v1.js'
      - 'visual-lab-test-banner.js'
      - 'journey-progress-caption.js'
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm only Visual Lab is being tested
        run: |
          node --check word-trails-native-shell-v1.js
          node --check word-trails-next-launcher.js
          node --check experiments/word-trails-unified-menu-v1.js
          node --check experiments/word-trails-announcer-v1.js
          node --check experiments/word-trails-main-settings-v1.js
          node --check scripts/word_trails_native_shell_integration_test.cjs
          node --check scripts/qa_word_trails_public_native_route_v36.cjs
          node scripts/qa_word_trails_public_native_route_v36.cjs
          test -f BIBLE_UNFOLDED_RULEBOOK_START_HERE.md
      - name: Native homepage plus embedded Word Trails mobile browser QA
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-native-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8891 --bind 127.0.0.1 >/tmp/bu-native-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-native-qa/node_modules node scripts/word_trails_native_shell_integration_test.cjs
      - name: Published TEST direct link never opens duplicate standalone QA menu
        run: |
          set -euo pipefail
          SITE='https://basilejoseph325-jpg.github.io/Bible-Unfolded-Visual-Lab'
          for attempt in $(seq 1 24); do
            if curl -fsSL --max-time 35 -H 'Cache-Control: no-cache' "$SITE/experiments/word-trails-next-v1.html?v36=$attempt" |
               grep -F 'Published links always load the real native menu/Settings host.' >/dev/null; then
              echo 'PASS: public TEST is serving the updated native-only Word Trails entry'
              break
            fi
            if [ "$attempt" = 24 ]; then
              echo 'FAIL: public Word Trails direct-link guard not deployed' >&2
              exit 1
            fi
            sleep 5
          done
          NODE_PATH=/tmp/bu-native-qa/node_modules node - <<'JS'
          const puppeteer=require('puppeteer-core');
          const assert=require('node:assert/strict');
          const {execSync}=require('node:child_process');
          const chrome=execSync('command -v google-chrome || command -v chromium',{encoding:'utf8'}).trim();
          (async()=>{
            const browser=await puppeteer.launch({executablePath:chrome,headless:true,
              args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
            try{
              for(const query of ['?standalone=qa','?standalone=qa&native=1']){
                const context=await browser.createBrowserContext();
                const page=await context.newPage(),errors=[];
                page.on('pageerror',e=>errors.push(e.message));
                await page.setViewport({width:390,height:705,isMobile:true,hasTouch:true});
                await page.goto('https://basilejoseph325-jpg.github.io/Bible-Unfolded-Visual-Lab/experiments/word-trails-next-v1.html'+query,
                  {waitUntil:'domcontentloaded',timeout:120000});
                await page.waitForFunction(()=>
                  location.pathname.endsWith('/Bible-Unfolded-Visual-Lab/index.html') &&
                  window.BUWTNativeShell?.active?.() &&
                  document.getElementById('game-menu') &&
                  document.getElementById('settings-dialog') &&
                  document.getElementById('bu-wt-native-game')?.contentWindow?.BUWTUnifiedMenu,
                  {timeout:100000});
                const result=await page.evaluate(()=>({
                  realRootMenu:!!document.getElementById('game-menu'),
                  nativeActive:window.BUWTNativeShell.active(),
                  rootSettings:!!document.getElementById('settings-dialog'),
                  url:location.pathname,hasNativeFrame:!!document.getElementById('bu-wt-native-game'),
                  duplicateMenuOpen:document.getElementById('bu-wt-native-game')?.contentWindow?.document?.getElementById('wt-unified-menu')?.open===true
                }));
                assert(result.realRootMenu&&result.nativeActive&&result.rootSettings&&result.hasNativeFrame);
                assert.equal(result.duplicateMenuOpen,false);
                assert.deepEqual(errors,[]);
                console.log('PASS_PUBLIC_NATIVE_WT_DIRECT_LINK_V36',JSON.stringify({query,...result,pageErrors:0}));
                await context.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error('FAIL_PUBLIC_NATIVE_WT_DIRECT_LINK_V36',e.stack||e);process.exitCode=1});
          JS
