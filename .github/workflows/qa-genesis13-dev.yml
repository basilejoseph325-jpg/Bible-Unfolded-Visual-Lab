name: Genesis 13 development wheel smoke (no deployment)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'story-adventure-content/genesis-episode13-*'
      - 'genesis-episode13-preview.html'
      - 'scripts/qa_genesis13_*'
      - '.github/workflows/qa-genesis13-dev.yml'
permissions:
  contents: read
jobs:
  preview-wheel:
    if: github.repository == 'basilejoseph325-jpg/Bible-Unfolded-Visual-Lab'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix work --no-audit --no-fund puppeteer-core@25.17.0
      - name: Start isolated local server
        run: |
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          python3 -m http.server 8893 --bind 127.0.0.1 > work/http-genesis13.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8893/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Compile the isolated chapter adapter
        run: node --check story-adventure-content/genesis-episode13-native-preview.js
      - name: Check Genesis 13 sourced puzzle structure
        run: node scripts/qa_genesis13_content_candidate.cjs
      - name: Play Genesis 13 with actual native wheel in Chromium, two phone sizes
        env:
          NODE_PATH: '${{ github.workspace }}/work/node_modules'
          STORY_EVIDENCE: work/genesis13-evidence.json
        run: node scripts/qa_genesis13_native_preview.cjs
      - name: Existing Episode 12 regression and ordinary navigation isolation
        env:
          NODE_PATH: '${{ github.workspace }}/work/node_modules'
        run: |
          node scripts/qa_genesis12_native.cjs
          node scripts/qa_genesis13_boundaries.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis13-candidate-evidence
          path: work/genesis13-evidence.json
          if-no-files-found: ignore
