name: Publish Play Together button colors and compact study controls (one-time)
on:
  push:
    paths:
      - .github/workflows/cache-bust-play-together-icons-v10.yml
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact CSS state and invalidate browser caches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import re
          expected={
            'play-together-cinematic.css':'5fa547d6646a9fa5c3c7151bc302ea29d8af0309',
            'trivia-together-premium.css':'af034fd23bd7f155d61762b081a836b72cccae0b',
            'index.html':'88887fca7ee9325f5973a88a0c22c78002f905b4'
          }
          for file,sha in expected.items():
            actual=subprocess.check_output(['git','hash-object',file],text=True).strip()
            assert actual==sha,('File changed; abort',file,actual)
          style=Path('trivia-together-premium.css')
          css=style.read_text(encoding='utf-8')
          old='@import url("./play-together-cinematic.css?v=play-together-mask-fixed-v9");'
          new='@import url("./play-together-cinematic.css?v=pt-gold-icons-study-compact-v10");'
          assert css.count(old)==1,'Unexpected cinematic import'
          style.write_text(css.replace(old,new),encoding='utf-8')
          html=Path('index.html')
          source=html.read_text(encoding='utf-8')
          patt=r'<link rel="stylesheet" href="trivia-together-premium[.]css[?]v=[^"]+">'
          matches=re.findall(patt,source)
          assert len(matches)==1,('Unexpected head CSS link',matches)
          replacement='<link rel="stylesheet" href="trivia-together-premium.css?v=pt-gold-icons-study-compact-v10">'
          html.write_text(source.replace(matches[0],replacement),encoding='utf-8')
          print('Updated exactly one import and one outer stylesheet reference')
          PY
          git rm -f .github/workflows/cache-bust-play-together-icons-v10.yml
          git add -- index.html trivia-together-premium.css
          python3 - <<'PY'
          import subprocess
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'index.html','trivia-together-premium.css','.github/workflows/cache-bust-play-together-icons-v10.yml'}
          assert staged==expected,('Unexpected changes',staged)
          PY
      - name: Publish updated links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Visual Lab: refresh Play Together gold and compact icon styles"
          git push origin HEAD:main
