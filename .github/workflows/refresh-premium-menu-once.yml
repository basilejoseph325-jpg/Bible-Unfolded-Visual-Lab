name: Refresh premium Trivia Together illustrated menus once
on:
  push:
    paths:
      - .github/workflows/refresh-premium-menu-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate current approved test files and refresh CSS JS cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "fad7b760db42643c0bfbede1e8d9606384b50f71" || { echo "index changed: abort"; exit 1; }
          test "$(git hash-object trivia-together-premium.css)" = "fb4dddf80da1d6f3b549e441302a460f95f8405e" || { echo "CSS changed: abort"; exit 1; }
          test "$(git hash-object trivia-together-premium.js)" = "cb166bfa16eb4cdb5b36df6730c9911d257ab8ba" || { echo "JS changed: abort"; exit 1; }
          node --check trivia-together-premium.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          b=p.read_bytes()
          for path in (b'trivia-together-premium.css',b'trivia-together-premium.js'):
              original=path+b'?v=1'
              assert b.count(original)==1,(path,b.count(original))
              b=b.replace(original,path+b'?v=2')
          p.write_bytes(b)
          css=Path("trivia-together-premium.css").read_text()
          js=Path("trivia-together-premium.js").read_text()
          assert "background-size:cover" in css
          assert "b.style.backgroundImage=sceneBackground(entry.value,entry.label,type)" in js
          assert "button.style.backgroundImage=sceneBackground(select.value,selectedText(select),type)" in js
          assert "transparent 43%" in css
          PY
          git diff --check
      - name: Commit cache refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Visual Lab: refresh illustrated full-scene Trivia Together menu assets"
          git push
