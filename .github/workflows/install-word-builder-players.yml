name: Install Word Builder Players Visual Lab styling
on:
  push:
    paths:
      - '.github/workflows/install-word-builder-players.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add isolated players page script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="word-builder-players-visual.js?v=1"></script>'
          if 'word-builder-players-visual.js' not in s:
              if '</body>' not in s: raise SystemExit('Missing body close')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader if needed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Load Word Builder Players Visual Lab enhancement"
            git push
          fi
